<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Quản lý đơn hàng</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:20px;
    font-family:Arial,sans-serif;
    background:#f4f6f9;
    color:#222;
}

.container{
    max-width:1100px;
    margin:auto;
}

h1{
    text-align:center;
    font-size:38px;
    margin:20px 0 30px;
}

.admin-box{
    background:white;
    border-radius:22px;
    padding:22px;
    box-shadow:0 5px 20px rgba(0,0,0,.08);
    margin-bottom:25px;
}

.admin-login{
    display:flex;
    gap:12px;
    flex-wrap:wrap;
}

.admin-login input{
    flex:1;
    min-width:200px;
    padding:15px;
    border:1px solid #ddd;
    border-radius:12px;
    font-size:16px;
}

button{
    border:0;
    border-radius:12px;
    padding:13px 18px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.login-btn{
    background:#287bea;
    color:white;
}

.refresh-btn{
    background:#444;
    color:white;
}

#message{
    margin-top:15px;
    font-weight:bold;
}

.orders{
    display:flex;
    flex-direction:column;
    gap:18px;
}

.order{
    background:white;
    border-radius:20px;
    padding:20px;
    box-shadow:0 4px 18px rgba(0,0,0,.08);
}

.order-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
    flex-wrap:wrap;
    margin-bottom:15px;
}

.order-code{
    font-size:22px;
    font-weight:bold;
    color:#287bea;
    word-break:break-all;
}

.status{
    padding:9px 15px;
    border-radius:10px;
    font-weight:bold;
}

.status.pending{
    background:#fff1cf;
    color:#d58b00;
}

.status.paid{
    background:#d9f7df;
    color:#16883c;
}

.info{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:12px;
    margin-bottom:18px;
}

.info-row{
    background:#f7f8fa;
    border-radius:12px;
    padding:12px;
}

.label{
    display:block;
    color:#777;
    font-size:14px;
    margin-bottom:5px;
}

.value{
    font-size:17px;
    font-weight:bold;
    word-break:break-word;
}

.actions{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
}

.pay-btn{
    background:#16883c;
    color:white;
}

.pay-btn.done{
    background:#999;
    cursor:default;
}

.recharge-btn{
    background:linear-gradient(90deg,#ffbd00,#ff7900);
    color:#111;
}

.recharge-btn.done{
    background:#16883c;
    color:white;
    cursor:default;
}

.empty{
    text-align:center;
    padding:40px;
    color:#777;
    background:white;
    border-radius:20px;
}

.loading{
    text-align:center;
    padding:30px;
    color:#777;
}

@media(max-width:650px){

    body{
        padding:12px;
    }

    h1{
        font-size:30px;
    }

    .info{
        grid-template-columns:1fr;
    }

    .actions button{
        width:100%;
    }
}
</style>
</head>

<body>

<div class="container">

<h1>🛠️ Quản lý đơn hàng</h1>

<div class="admin-box">

    <h2>🔐 Đăng nhập Admin</h2>

    <div class="admin-login">

        <input
            id="adminPassword"
            type="password"
            placeholder="Nhập mật khẩu Admin"
        >

        <button
            class="login-btn"
            onclick="loginAdmin()">
            🔑 Đăng nhập
        </button>

        <button
            class="refresh-btn"
            onclick="loadOrders()">
            🔄 Làm mới
        </button>

    </div>

    <div id="message"></div>

</div>


<div id="orders" class="orders">
    <div class="loading">
        🔄 Đang tải đơn hàng...
    </div>
</div>


</div>


<script>

let adminAuth = sessionStorage.getItem("adminAuth") || "";

const ordersBox = document.getElementById("orders");
const message = document.getElementById("message");


/* =========================
   ĐĂNG NHẬP ADMIN
========================= */

async function loginAdmin(){

    const password =
        document.getElementById("adminPassword").value.trim();

    if(!password){

        alert("Vui lòng nhập mật khẩu Admin.");

        return;
    }

    adminAuth =
        "Basic " + btoa("admin:" + password);

    sessionStorage.setItem("adminAuth",adminAuth);

    await loadOrders();
}


/* =========================
   GỌI API ADMIN
========================= */

async function adminFetch(url, options = {}){

    options.headers = {
        ...(options.headers || {}),
        "Authorization": adminAuth
    };

    const response = await fetch(url, options);

    if(response.status === 401){

        sessionStorage.removeItem("adminAuth");
        adminAuth = "";

        throw new Error(
            "Phiên Admin hết hạn hoặc chưa đăng nhập."
        );
    }

    if(response.status === 403){

        throw new Error(
            "Sai mật khẩu Admin."
        );
    }

    return response;
}


/* =========================
   TẢI DANH SÁCH ĐƠN
========================= */

async function loadOrders(){

    if(!adminAuth){

        ordersBox.innerHTML = `
            <div class="empty">
                🔐 Vui lòng đăng nhập Admin.
            </div>
        `;

        return;
    }

    ordersBox.innerHTML = `
        <div class="loading">
            🔄 Đang tải đơn hàng...
        </div>
    `;

    try{

        const response =
            await adminFetch("/api/admin/orders");

        const data =
            await response.json();

        if(!response.ok){

            throw new Error(
                data.error ||
                data.message ||
                "Không thể tải đơn hàng."
            );
        }

        const orders =
            data.orders || [];

        if(!orders.length){

            ordersBox.innerHTML = `
                <div class="empty">
                    📦 Chưa có đơn hàng nào.
                </div>
            `;

            return;
        }

        ordersBox.innerHTML =
            orders.map(renderOrder).join("");

        message.innerHTML =
            `✅ Đã tải ${orders.length} đơn hàng.`;

        message.style.color = "#16883c";

    }catch(error){

        console.error(error);

        ordersBox.innerHTML = `
            <div class="empty">
                ❌ ${escapeHtml(error.message)}
            </div>
        `;

        message.innerHTML =
            "❌ Không thể tải đơn hàng.";

        message.style.color = "#d33";
    }
}


/* =========================
   HIỂN THỊ 1 ĐƠN
========================= */

function renderOrder(order){

    const orderCode =
        order.order_code || "";

    const playerId =
        order.player_id || "";

    const packageName =
        order.package_name || "";

    const amount =
        Number(order.amount || 0)
        .toLocaleString("vi-VN");

    const paymentContent =
        order.payment_content || "Chưa có";

    const paymentId =
        order.payment_id || "Chưa có";

    const createdAt =
        formatDate(order.created_at);

    const paidAt =
        order.paid_at
            ? formatDate(order.paid_at)
            : "Chưa có";

    const isPaid =
        String(order.status).toUpperCase() === "PAID";


    return `

    <div
        class="order"
        id="order-${escapeHtml(orderCode)}"
    >

        <div class="order-header">

            <div class="order-code">
                ${escapeHtml(orderCode)}
            </div>

            <div class="
                status
                ${isPaid ? "paid" : "pending"}
            ">

                ${
                    isPaid
                    ? "🟢 THÀNH CÔNG"
                    : "🟡 CHỜ THANH TOÁN"
                }

            </div>

        </div>


        <div class="info">

            <div class="info-row">

                <span class="label">
                    👤 ID Free Fire
                </span>

                <span class="value">
                    ${escapeHtml(playerId)}
                </span>

            </div>


            <div class="info-row">

                <span class="label">
                    💎 Gói nạp
                </span>

                <span class="value">
                    ${escapeHtml(packageName)}
                </span>

            </div>


            <div class="info-row">

                <span class="label">
                    💰 Số tiền
                </span>

                <span class="value">
                    ${amount} VNĐ
                </span>

            </div>


            <div class="info-row">

                <span class="label">
                    📝 Nội dung chuyển khoản
                </span>

                <span class="value">
                    ${escapeHtml(paymentContent)}
                </span>

            </div>


            <div class="info-row">

                <span class="label">
                    💳 Mã giao dịch
                </span>

                <span class="value">
                    ${escapeHtml(paymentId)}
                </span>

            </div>


            <div class="info-row">

                <span class="label">
                    🕐 Tạo lúc
                </span>

                <span class="value">
                    ${escapeHtml(createdAt)}
                </span>

            </div>


            <div class="info-row">

                <span class="label">
                    💳 Thanh toán lúc
                </span>

                <span class="value">
                    ${escapeHtml(paidAt)}
                </span>

            </div>

        </div>


        <div class="actions">

            ${
                isPaid

                ?

                `
                <button
                    class="pay-btn done"
                    disabled
                >
                    ✅ Đã thanh toán
                </button>

                <button
                    class="recharge-btn done"
                    disabled
                >
                    💎 Đã nạp thành công
                </button>
                `

                :

                `
                <button
                    class="pay-btn"
                    onclick="xacNhanThanhToanUI('${escapeJs(orderCode)}')"
                >
                    💳 Xác nhận đã thanh toán
                </button>

                <button
                    class="recharge-btn"
                    onclick="xacNhanDaNap('${escapeJs(orderCode)}')"
                >
                    💎 Xác nhận đã nạp thành công
                </button>
                `
            }

        </div>

    </div>

    `;
}


/* =========================
   XÁC NHẬN ĐÃ THANH TOÁN
========================= */

/*
   Server hiện tại của bạn chỉ có 2 trạng thái:

   PENDING
   PAID

   Vì vậy nút này dùng để admin xác nhận
   tiền đã được nhận ở giao diện.

   Muốn lưu riêng trạng thái này vào database
   thì cần thêm một cột/backend riêng.
*/

function xacNhanThanhToanUI(orderCode){

    const ok =
        confirm(
            "Xác nhận khách đã chuyển khoản cho đơn " +
            orderCode +
            "?"
        );

    if(!ok) return;

    const order =
        document.getElementById(
            "order-" + orderCode
        );

    if(!order) return;

    const button =
        order.querySelector(".pay-btn");

    button.textContent =
        "✅ Đã thanh toán";

    button.classList.add("done");

    button.disabled = true;

    alert(
        "✅ Đã đánh dấu giao diện là đã thanh toán."
    );
}


/* =========================
   XÁC NHẬN ĐÃ NẠP THÀNH CÔNG
========================= */

async function xacNhanDaNap(orderCode){

    const ok =
        confirm(
            "Bạn chắc chắn đã nạp kim cương thành công cho ID của đơn " +
            orderCode +
            "?"
        );

    if(!ok) return;


    try{

        const response =
            await adminFetch(
                "/api/admin/orders/" +
                encodeURIComponent(orderCode) +
                "/confirm",
                {
                    method:"POST"
                }
            );


        const data =
            await response.json();


        if(!response.ok){

            throw new Error(
                data.error ||
                data.message ||
                "Không thể xác nhận đơn."
            );
        }


        alert(
            "💎 Đã xác nhận nạp thành công!"
        );


        await loadOrders();


    }catch(error){

        console.error(error);

        alert(
            "❌ " + error.message
        );
    }
}


/* =========================
   FORMAT NGÀY
========================= */

function formatDate(value){

    if(!value){
        return "Chưa có";
    }

    const date =
        new Date(value);

    if(Number.isNaN(date.getTime())){
        return String(value);
    }

    return date.toLocaleString(
        "vi-VN",
        {
            hour:"2-digit",
            minute:"2-digit",
            second:"2-digit",
            day:"2-digit",
            month:"2-digit",
            year:"numeric"
        }
    );
}


/* =========================
   CHỐNG HTML INJECTION
========================= */

function escapeHtml(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}


function escapeJs(value){

    return String(value ?? "")
        .replace(/\\/g,"\\\\")
        .replace(/'/g,"\\'")
        .replace(/\n/g,"\\n")
        .replace(/\r/g,"\\r");
}


/* =========================
   TỰ ĐỘNG TẢI
========================= */

loadOrders();


/* Tự làm mới mỗi 10 giây */

setInterval(() => {

    if(adminAuth){
        loadOrders();
    }

},10000);

</script>

</body>
</html>
