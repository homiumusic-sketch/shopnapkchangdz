<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Admin - Quản lý nạp Free Fire</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#080910;
  color:white;
}

.hidden{
  display:none!important;
}

/* =========================
   LOGIN
========================= */

#loginPage{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:
    radial-gradient(circle at top,#24133d,#080910 55%);
}

.login-box{
  width:100%;
  max-width:420px;
  background:#171821;
  border:1px solid #333;
  border-radius:22px;
  padding:28px 22px;
  box-shadow:0 20px 60px rgba(0,0,0,.5);
}

.login-title{
  text-align:center;
  color:#ffd21c;
  font-size:28px;
  margin:0 0 8px;
}

.login-subtitle{
  text-align:center;
  color:#aaa;
  margin-bottom:25px;
}

.login-box label{
  display:block;
  margin-bottom:8px;
  color:#ddd;
  font-weight:bold;
}

.login-box input{
  width:100%;
  padding:15px;
  border-radius:12px;
  border:1px solid #444;
  background:#0d0e15;
  color:white;
  font-size:17px;
  outline:none;
  margin-bottom:15px;
}

.login-button{
  width:100%;
  padding:16px;
  border:0;
  border-radius:13px;
  background:linear-gradient(90deg,#ffca05,#ff7b00);
  color:#111;
  font-size:19px;
  font-weight:bold;
  cursor:pointer;
}

.login-error{
  margin-top:15px;
  padding:13px;
  border-radius:12px;
  background:#3b1d1d;
  color:#ff7070;
  text-align:center;
}

/* =========================
   ADMIN
========================= */

#adminPage{
  min-height:100vh;
}

.header{
  padding:22px 15px;
  background:linear-gradient(135deg,#11111b,#25113e);
  border-bottom:1px solid #292a35;
}

.header-inner{
  max-width:1000px;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
}

.header h1{
  margin:0;
  color:#ffd21c;
  font-size:27px;
}

.logout-button{
  border:0;
  border-radius:11px;
  padding:11px 16px;
  background:#555;
  color:white;
  font-weight:bold;
  cursor:pointer;
}

.container{
  width:100%;
  max-width:1000px;
  margin:auto;
  padding:20px 15px 80px;
}

/* =========================
   TOOLBAR
========================= */

.toolbar{
  background:#171821;
  padding:18px;
  border-radius:18px;
  margin-bottom:20px;
}

.toolbar-title{
  margin:0 0 13px;
  color:#ffd21c;
}

.toolbar-row{
  display:flex;
  gap:10px;
}

.toolbar input{
  flex:1;
  min-width:0;
  padding:14px;
  border-radius:12px;
  border:1px solid #444;
  background:#0d0e15;
  color:white;
  font-size:16px;
}

.toolbar button{
  padding:14px 18px;
  border:0;
  border-radius:12px;
  background:#2878e8;
  color:white;
  font-weight:bold;
  cursor:pointer;
}

/* =========================
   ORDER CARD
========================= */

.orders{
  display:grid;
  gap:15px;
}

.order-card{
  background:#171821;
  border:1px solid #333;
  border-radius:18px;
  padding:18px;
}

.order-top{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:12px;
  margin-bottom:15px;
}

.order-code{
  color:#4d8dff;
  font-size:20px;
  font-weight:bold;
  word-break:break-all;
}

.status{
  display:inline-block;
  padding:8px 12px;
  border-radius:10px;
  font-size:14px;
  font-weight:bold;
  white-space:nowrap;
}

.status-paid{
  background:#063d23;
  color:#25d366;
}

.status-processing{
  background:#3d3210;
  color:#ffd21c;
}

.status-recharged{
  background:#064c2a;
  color:#36e879;
}

.order-info{
  border-top:1px solid #333;
}

.info-row{
  display:flex;
  justify-content:space-between;
  gap:15px;
  padding:11px 0;
  border-bottom:1px solid #292a31;
}

.info-row:last-child{
  border-bottom:0;
}

.info-label{
  color:#999;
}

.info-value{
  color:white;
  font-weight:bold;
  text-align:right;
  word-break:break-word;
}

/*
  Cố tình KHÔNG hiển thị:
  - UID
  - số tiền
  - nội dung chuyển khoản
  - mã giao dịch
*/

.recharge-button{
  width:100%;
  margin-top:15px;
  padding:15px;
  border:0;
  border-radius:13px;
  background:#18b957;
  color:white;
  font-size:18px;
  font-weight:bold;
  cursor:pointer;
}

.recharge-button:disabled{
  opacity:.5;
  cursor:not-allowed;
}

.empty{
  padding:25px;
  background:#171821;
  border-radius:18px;
  text-align:center;
  color:#aaa;
}

.loading{
  padding:25px;
  text-align:center;
  color:#aaa;
}

/* =========================
   MOBILE
========================= */

@media(max-width:600px){

  .header-inner{
    align-items:flex-start;
  }

  .header h1{
    font-size:22px;
  }

  .toolbar-row{
    flex-direction:column;
  }

  .toolbar button{
    width:100%;
  }

  .order-top{
    flex-direction:column;
  }

  .info-row{
    flex-direction:column;
    gap:4px;
  }

  .info-value{
    text-align:left;
  }

}
</style>
</head>

<body>


<!-- =================================================
     TRANG ĐĂNG NHẬP ADMIN
================================================= -->

<section id="loginPage">

  <div class="login-box">

    <h1 class="login-title">
      🔐 ADMIN
    </h1>

    <div class="login-subtitle">
      Đăng nhập để quản lý đơn nạp
    </div>


    <label for="adminUsername">
      👤 Tài khoản admin
    </label>

    <input
      id="adminUsername"
      type="text"
      autocomplete="username"
      placeholder="Nhập tài khoản admin"
    >


    <label for="adminPassword">
      🔑 Mật khẩu
    </label>

    <input
      id="adminPassword"
      type="password"
      autocomplete="current-password"
      placeholder="Nhập mật khẩu"
    >


    <button
      class="login-button"
      type="button"
      onclick="adminLogin()"
    >
      🔐 Đăng nhập
    </button>


    <div
      id="loginError"
      class="login-error hidden"
    ></div>

  </div>

</section>


<!-- =================================================
     TRANG ADMIN
================================================= -->

<section
  id="adminPage"
  class="hidden"
>

  <header class="header">

    <div class="header-inner">

      <h1>
        ⚙️ QUẢN LÝ ĐƠN NẠP
      </h1>

      <button
        class="logout-button"
        type="button"
        onclick="adminLogout()"
      >
        🚪 Đăng xuất
      </button>

    </div>

  </header>


  <main class="container">


    <!-- ===============================
         TÌM KIẾM
    ================================ -->

    <div class="toolbar">

      <h2 class="toolbar-title">
        📦 Danh sách đơn nạp
      </h2>

      <div class="toolbar-row">

        <input
          id="searchCode"
          type="text"
          placeholder="Nhập mã đơn hàng..."
          autocomplete="off"
        >

        <button
          type="button"
          onclick="loadOrders()"
        >
          🔄 Tải đơn
        </button>

      </div>

    </div>


    <!-- ===============================
         ĐƠN HÀNG
    ================================ -->

    <div
      id="orders"
      class="orders"
    >

      <div class="loading">
        ⏳ Đang tải đơn hàng...
      </div>

    </div>

  </main>

</section>


<script>

/* =================================================
   BIẾN
================================================= */

let adminToken = "";

let refreshTimer = null;


/* =================================================
   ESCAPE
================================================= */

function escapeHtml(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =================================================
   ĐĂNG NHẬP
================================================= */

async function adminLogin(){

  const username =
    document
      .getElementById("adminUsername")
      .value
      .trim();

  const password =
    document
      .getElementById("adminPassword")
      .value;


  const errorBox =
    document.getElementById("loginError");


  errorBox.classList.add("hidden");


  if(!username || !password){

    errorBox.textContent =
      "❌ Vui lòng nhập tài khoản và mật khẩu.";

    errorBox.classList.remove("hidden");

    return;
  }


  try{

    /*
      Backend cần có:
      POST /api/admin/login
    */

    const response =
      await fetch(
        "/api/admin/login",
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json",

            "Accept":
              "application/json"
          },

          body:JSON.stringify({
            username:username,
            password:password
          })
        }
      );


    const data =
      await response.json();


    if(
      !response.ok ||
      !data.success
    ){

      throw new Error(
        data.message ||
        "Tài khoản hoặc mật khẩu không đúng."
      );

    }


    /*
      Backend có thể trả:
      token
      hoặc access_token
    */

    adminToken =
      data.token ||
      data.access_token ||
      "";


    if(!adminToken){

      throw new Error(
        "Server chưa trả token đăng nhập."
      );

    }


    sessionStorage.setItem(
      "adminToken",
      adminToken
    );


    hienThiAdmin();


  }

  catch(error){

    console.error(
      "ADMIN LOGIN:",
      error
    );


    errorBox.textContent =
      "❌ " +
      (
        error.message ||
        "Không thể đăng nhập."
      );


    errorBox.classList.remove(
      "hidden"
    );

  }

}


/* =================================================
   HIỆN ADMIN
================================================= */

function hienThiAdmin(){

  document
    .getElementById("loginPage")
    .classList.add("hidden");


  document
    .getElementById("adminPage")
    .classList.remove("hidden");


  loadOrders();


  if(refreshTimer){

    clearInterval(refreshTimer);

  }


  /*
    Tự tải lại danh sách
    mỗi 5 giây.
  */

  refreshTimer =
    setInterval(
      loadOrders,
      5000
    );

}


/* =================================================
   KIỂM TRA LOGIN CŨ
================================================= */

function checkAdminLogin(){

  const savedToken =
    sessionStorage.getItem(
      "adminToken"
    );


  if(savedToken){

    adminToken =
      savedToken;

    hienThiAdmin();

  }

}


/* =================================================
   ĐĂNG XUẤT
================================================= */

function adminLogout(){

  adminToken = "";

  sessionStorage.removeItem(
    "adminToken"
  );


  if(refreshTimer){

    clearInterval(
      refreshTimer
    );

    refreshTimer = null;

  }


  document
    .getElementById("adminPage")
    .classList.add("hidden");


  document
    .getElementById("loginPage")
    .classList.remove("hidden");


  document
    .getElementById("adminPassword")
    .value = "";

}


/* =================================================
   HEADER AUTH
================================================= */

function authHeaders(){

  return {

    "Accept":
      "application/json",

    "Authorization":
      "Bearer " + adminToken

  };

}


/* =================================================
   TẢI ĐƠN
================================================= */

async function loadOrders(){

  const box =
    document.getElementById(
      "orders"
    );


  if(!adminToken){

    return;

  }


  const search =
    document
      .getElementById("searchCode")
      .value
      .trim()
      .toUpperCase();


  box.innerHTML = `
    <div class="loading">
      ⏳ Đang tải đơn hàng...
    </div>
  `;


  try{

    let url =
      "/api/admin/orders";


    if(search){

      url +=
        "?order_code=" +
        encodeURIComponent(search);

    }


    const response =
      await fetch(
        url,
        {
          method:"GET",
          cache:"no-store",
          headers:authHeaders()
        }
      );


    if(response.status === 401){

      adminLogout();

      alert(
        "Phiên đăng nhập admin đã hết hạn."
      );

      return;

    }


    const data =
      await response.json();


    if(
      !response.ok ||
      !data.success
    ){

      throw new Error(
        data.message ||
        "Không thể tải danh sách đơn."
      );

    }


    const orders =
      Array.isArray(data.orders)
        ? data.orders
        : [];


    if(!orders.length){

      box.innerHTML = `
        <div class="empty">
          📭 Không có đơn hàng.
        </div>
      `;

      return;

    }


    box.innerHTML =
      orders
        .map(renderOrder)
        .join("");

  }

  catch(error){

    console.error(
      "LOAD ORDERS:",
      error
    );


    box.innerHTML = `
      <div class="empty">
        ❌ ${escapeHtml(
          error.message ||
          "Không thể kết nối máy chủ."
        )}
      </div>
    `;

  }

}


/* =================================================
   HIỂN THỊ ĐƠN
================================================= */

function renderOrder(order){

  const status =
    String(
      order.status || ""
    ).toUpperCase();


  let statusClass =
    "status-processing";

  let statusText =
    "🟡 ĐANG XỬ LÝ";


  if(status === "PAID"){

    statusClass =
      "status-paid";

    statusText =
      "💳 ĐÃ THANH TOÁN";

  }


  if(status === "RECHARGED"){

    statusClass =
      "status-recharged";

    statusText =
      "🟢 ĐÃ NẠP KIM CƯƠNG";

  }


  const code =
    escapeHtml(
      order.order_code ||
      "Không có"
    );


  const packageName =
    escapeHtml(
      order.package_name ||
      "Không có"
    );


  const playerId =
    escapeHtml(
      order.player_id ||
      "Không có"
    );


  const createdAt =
    escapeHtml(
      formatDate(
        order.created_at
      )
    );


  const paidAt =
    escapeHtml(
      formatDate(
        order.paid_at
      )
    );


  const canRecharge =
    status === "PAID";


  return `

    <div
      class="order-card"
      data-order-code="${code}"
    >

      <div class="order-top">

        <div>

          <div style="
            color:#999;
            font-size:14px;
            margin-bottom:5px;
          ">
            📦 Mã đơn hàng
          </div>

          <div class="order-code">
            ${code}
          </div>

        </div>


        <span
          class="status ${statusClass}"
        >
          ${statusText}
        </span>

      </div>


      <div class="order-info">


        <div class="info-row">

          <span class="info-label">
            💎 Gói
          </span>

          <span class="info-value">
            ${packageName}
          </span>

        </div>


        <div class="info-row">

          <span class="info-label">
            🎮 ID Free Fire
          </span>

          <span class="info-value">
            ${playerId}
          </span>

        </div>


        <div class="info-row">

          <span class="info-label">
            🕒 Tạo đơn
          </span>

          <span class="info-value">
            ${createdAt}
          </span>

        </div>


        <div class="info-row">

          <span class="info-label">
            💳 Thanh toán
          </span>

          <span class="info-value">
            ${paidAt}
          </span>

        </div>


      </div>


      ${
        canRecharge

        ? `

          <button
            class="recharge-button"
            type="button"
            onclick="xacNhanNap('${code}')"
          >
            💎 Đã nạp kim cương
          </button>

        `

        : status === "RECHARGED"

        ? `

          <button
            class="recharge-button"
            type="button"
            disabled
          >
            ✅ Đã nạp kim cương
          </button>

        `

        : ""

      }

    </div>

  `;

}


/* =================================================
   ADMIN XÁC NHẬN ĐÃ NẠP
================================================= */

async function xacNhanNap(orderCode){

  if(!confirm(
    "Bạn chắc chắn đã nạp kim cương cho đơn:\\n\\n" +
    orderCode +
    "\\n\\nSau khi xác nhận, khách sẽ thấy:\\n" +
    "🟢 ĐÃ NẠP KIM CƯƠNG"
  )){

    return;

  }


  try{

    const response =
      await fetch(
        "/api/admin/orders/" +
        encodeURIComponent(
          orderCode
        ) +
        "/recharge",
        {
          method:"POST",

          headers:{
            ...authHeaders(),
            "Content-Type":
              "application/json"
          },

          body:JSON.stringify({
            status:"RECHARGED"
          })

        }
      );


    if(response.status === 401){

      adminLogout();

      alert(
        "Phiên admin đã hết hạn."
      );

      return;

    }


    const data =
      await response.json();


    if(
      !response.ok ||
      !data.success
    ){

      throw new Error(
        data.message ||
        "Không thể cập nhật đơn."
      );

    }


    alert(
      "✅ Đã xác nhận nạp kim cương cho đơn:\\n" +
      orderCode
    );


    loadOrders();

  }

  catch(error){

    console.error(
      "RECHARGE ERROR:",
      error
    );


    alert(
      "❌ " +
      (
        error.message ||
        "Không thể cập nhật."
      )
    );

  }

}


/* =================================================
   FORMAT NGÀY
================================================= */

function formatDate(value){

  if(!value){

    return "Chưa có";

  }


  const date =
    new Date(value);


  if(
    Number.isNaN(
      date.getTime()
    )
  ){

    return String(value);

  }


  return date.toLocaleString(
    "vi-VN"
  );

}


/* =================================================
   ENTER TÌM KIẾM
================================================= */

document
  .getElementById(
    "searchCode"
  )
  .addEventListener(
    "keydown",
    function(event){

      if(
        event.key === "Enter"
      ){

        event.preventDefault();

        loadOrders();

      }

    }
  );


/* =================================================
   ENTER LOGIN
================================================= */

document
  .getElementById(
    "adminPassword"
  )
  .addEventListener(
    "keydown",
    function(event){

      if(
        event.key === "Enter"
      ){

        event.preventDefault();

        adminLogin();

      }

    }
  );


/* =================================================
   KHỞI ĐỘNG
================================================= */

checkAdminLogin();

</script>

</body>
</html>
