<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ADMIN - Quản lý đơn nạp</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#080910;color:#fff}
.container{width:100%;max-width:1000px;margin:auto;padding:25px 15px 100px}
.card{background:#171821;border:1px solid #30313a;border-radius:22px;padding:25px;margin-bottom:20px}
.login-card{max-width:600px;margin:80px auto 0}
h1{text-align:center;color:#ffd21c;font-size:34px;margin:0 0 10px}
.subtitle{text-align:center;color:#aaa;font-size:18px;margin-bottom:30px}
label{display:block;margin:18px 0 9px;font-size:18px;font-weight:bold}
input{width:100%;padding:16px;border-radius:13px;border:1px solid #444;outline:none;background:#0d0e15;color:#fff;font-size:18px}
button{border:0;border-radius:13px;padding:15px 20px;font-size:17px;font-weight:bold;cursor:pointer}
.login-button{width:100%;margin-top:25px;background:linear-gradient(90deg,#ffca05,#ff7b00);color:#111;font-size:20px}
.logout-button{background:#33343d;color:#fff}
.refresh-button{background:#2878e8;color:#fff}
.error{margin-top:18px;padding:15px;border-radius:13px;background:#401d20;color:#ff7777;text-align:center}
.success{margin-top:18px;padding:15px;border-radius:13px;background:#0c3b25;color:#35e982;text-align:center}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:20px;flex-wrap:wrap}
.topbar h2{margin:0;color:#ffd21c}
.order{background:#0d0e15;border:1px solid #333;border-radius:17px;padding:18px;margin-top:15px}
.order-header{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding-bottom:13px;border-bottom:1px solid #333}
.order-code{color:#4f91ff;font-size:20px;font-weight:bold}
.status{padding:8px 13px;border-radius:10px;font-weight:bold}
.status-pending{background:#403713;color:#ffd21c}
.status-processing{background:#102d50;color:#55a3ff}
.status-paid{background:#093b24;color:#35e982}
.info{line-height:1.9;color:#ddd;margin-top:13px}
.info b{color:#fff}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.processing-button{background:#2878e8;color:#fff}
.paid-button{background:#19bd61;color:#fff}
.disabled-button{opacity:.5;cursor:not-allowed}
.hidden{display:none!important}
.loading{text-align:center;color:#aaa;padding:30px}

@media(max-width:600px){
.container{padding:15px 10px 80px}
.login-card{margin-top:30px}
h1{font-size:29px}
.card{padding:18px}
.actions button{width:100%}
}
</style>
</head>

<body>

<div class="container">

<div id="loginPage" class="card login-card">

<h1>🔐 ADMIN</h1>

<div class="subtitle">
Đăng nhập để quản lý đơn nạp
</div>

<label>👤 Tài khoản admin</label>

<input
id="username"
type="text"
autocomplete="username"
placeholder="Nhập tài khoản"
>

<label>🔑 Mật khẩu</label>

<input
id="password"
type="password"
autocomplete="current-password"
placeholder="Nhập mật khẩu"
>

<button
class="login-button"
onclick="loginAdmin()"
>
🔐 Đăng nhập
</button>

<div id="loginMessage"></div>

</div>


<div id="adminPage" class="hidden">

<div class="topbar">

<h2>📦 QUẢN LÝ ĐƠN NẠP</h2>

<div style="display:flex;gap:10px;flex-wrap:wrap">

<button
class="refresh-button"
onclick="loadOrders()"
>
🔄 Tải lại
</button>

<button
class="logout-button"
onclick="logoutAdmin()"
>
🚪 Đăng xuất
</button>

</div>

</div>


<div class="card">

<div id="orders">

<div class="loading">
⏳ Đang tải đơn hàng...
</div>

</div>

</div>

</div>

</div>


<script>

const LOGIN_API="/api/admin/login";

const ORDERS_API="/api/orders";

let adminToken=
localStorage.getItem("admin_token")||"";


function escapeHtml(value){

return String(value??"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


function escapeJs(value){

return String(value??"")
.replace(/\\/g,"\\\\")
.replace(/'/g,"\\'")
.replace(/\n/g,"\\n")
.replace(/\r/g,"\\r");

}


function formatDate(value){

if(!value)return"Chưa có";

const d=new Date(value);

return Number.isNaN(d.getTime())
?String(value)
:d.toLocaleString("vi-VN");

}


function showLoginError(message){

document.getElementById("loginMessage").innerHTML=

`<div class="error">
❌ ${escapeHtml(message)}
</div>`;

}


function showLoginSuccess(message){

document.getElementById("loginMessage").innerHTML=

`<div class="success">
✅ ${escapeHtml(message)}
</div>`;

}


async function loginAdmin(){

const username=
document.getElementById("username")
.value.trim();

const password=
document.getElementById("password")
.value;

const button=
document.querySelector(".login-button");


if(!username){

showLoginError(
"Vui lòng nhập tài khoản."
);

return;

}


if(!password){

showLoginError(
"Vui lòng nhập mật khẩu."
);

return;

}


button.disabled=true;

button.innerText=
"⏳ Đang đăng nhập...";


try{

const response=
await fetch(
LOGIN_API,
{
method:"POST",

headers:{
"Content-Type":
"application/json",

"Accept":
"application/json"
},

body:
JSON.stringify({
username,
password
})
}
);


const data=
await response
.json()
.catch(()=>({}));


if(
!response.ok||
!data.success
){

throw new Error(
data.message||
"Tài khoản hoặc mật khẩu không đúng."
);

}


adminToken=
data.token||
data.access_token||
data.admin_token;


if(!adminToken){

throw new Error(
"Server đăng nhập không trả về token."
);

}


localStorage.setItem(
"admin_token",
adminToken
);


showLoginSuccess(
"Đăng nhập thành công."
);


setTimeout(()=>{

document
.getElementById("loginPage")
.classList.add("hidden");

document
.getElementById("adminPage")
.classList.remove("hidden");

loadOrders();

},300);


}

catch(error){

adminToken="";

showLoginError(
error.message||
"Không thể đăng nhập."
);

}

finally{

button.disabled=false;

button.innerText=
"🔐 Đăng nhập";

}

}


function authHeaders(){

return{

"Accept":
"application/json",

"Authorization":
"Bearer "+adminToken

};

}


async function loadOrders(){

const box=
document.getElementById("orders");


box.innerHTML=
'<div class="loading">⏳ Đang tải đơn hàng...</div>';


try{

const response=
await fetch(
ORDERS_API,
{
method:"GET",

headers:
authHeaders(),

cache:
"no-store"
}
);


if(
response.status===401||
response.status===403
){

logoutAdmin();

return;

}


const data=
await response.json();


if(
!response.ok||
!data.success
){

throw new Error(
data.message||
"Không thể tải đơn."
);

}


const orders=
Array.isArray(data.orders)
?data.orders
:[];


if(!orders.length){

box.innerHTML=
'<div class="loading">📭 Chưa có đơn hàng.</div>';

return;

}


box.innerHTML=
orders
.map(renderOrder)
.join("");


}

catch(error){

box.innerHTML=

`<div class="error">
❌ ${escapeHtml(
error.message||
"Không thể kết nối máy chủ."
)}
</div>`;

}

}


function renderOrder(order){

const status=
String(
order.status||""
).toUpperCase();


let statusText=
"🟡 CHỜ THANH TOÁN";

let statusClass=
"status-pending";


if(status==="PROCESSING"){

statusText=
"🔵 ĐANG NẠP KIM CƯƠNG";

statusClass=
"status-processing";

}


if(status==="PAID"){

statusText=
"🟢 ĐÃ NẠP KIM CƯƠNG";

statusClass=
"status-paid";

}


const disabled=
status==="PAID";


return`

<div class="order">

<div class="order-header">

<div>

📦 Mã đơn:

<span class="order-code">

${escapeHtml(
order.order_code||
"Không có"
)}

</span>

</div>

<span class="status ${statusClass}">

${statusText}

</span>

</div>


<div class="info">

🎮 ID Free Fire:

<b>
${escapeHtml(
order.player_id||
"Không có"
)}
</b>

<br>

💎 Gói:

<b>
${escapeHtml(
order.package_name||
"Không có"
)}
</b>

<br>

💰 Số tiền:

<b>
${Number(
order.amount||0
).toLocaleString("vi-VN")}
VNĐ
</b>

<br>

📝 Nội dung chuyển khoản:

<b>
${escapeHtml(
order.transfer_content||
order.payment_content||
"Không có"
)}
</b>

<br>

🕒 Tạo đơn:

<b>
${formatDate(
order.created_at
)}
</b>

${
order.paid_at
?
`
<br>
✅ Nạp lúc:

<b>
${formatDate(
order.paid_at
)}
</b>
`
:""
}

</div>


<div class="actions">


<button

class="processing-button
${status==="PROCESSING"||
disabled
?"disabled-button":""
}"

${status==="PROCESSING"||
disabled
?"disabled":""
}

onclick="updateStatus(
'${escapeJs(
order.order_code
)}',
'PROCESSING'
)"

>

🔵 Đang nạp kim cương

</button>


<button

class="paid-button
${disabled
?"disabled-button":""
}"

${disabled
?"disabled":""
}

onclick="updateStatus(
'${escapeJs(
order.order_code
)}',
'PAID'
)"

>

💎 Đã nạp kim cương

</button>


</div>

</div>

`;

}


async function updateStatus(
orderCode,
newStatus
){

if(!orderCode){

alert(
"Không có mã đơn hàng."
);

return;

}


const text=
newStatus==="PROCESSING"

?

"Xác nhận bắt đầu nạp kim cương cho đơn này?"

:

"Xác nhận đã nạp kim cương cho khách?";


if(!confirm(text))
return;


try{

const response=
await fetch(

ORDERS_API+
"/"+
encodeURIComponent(
orderCode
)+
"/status",

{

method:"PATCH",

headers:{

...authHeaders(),

"Content-Type":
"application/json"

},

body:
JSON.stringify({
status:newStatus
})

}

);


if(
response.status===401||
response.status===403
){

logoutAdmin();

return;

}


const data=
await response
.json()
.catch(()=>({}));


if(
!response.ok||
!data.success
){

throw new Error(
data.message||
"Không thể cập nhật trạng thái."
);

}


alert(

newStatus==="PROCESSING"

?

"🔵 Đã chuyển sang ĐANG NẠP KIM CƯƠNG."

:

"💎 Đã xác nhận ĐÃ NẠP KIM CƯƠNG."

);


loadOrders();


}

catch(error){

alert(
"❌ "+
(
error.message||
"Không thể cập nhật đơn."
)
);

}

}


function logoutAdmin(){

adminToken="";

localStorage.removeItem(
"admin_token"
);


document
.getElementById("adminPage")
.classList.add("hidden");


document
.getElementById("loginPage")
.classList.remove("hidden");


document
.getElementById("password")
.value="";


document
.getElementById("loginMessage")
.innerHTML="";

}


document.addEventListener(
"DOMContentLoaded",
()=>{

if(adminToken){

document
.getElementById("loginPage")
.classList.add("hidden");

document
.getElementById("adminPage")
.classList.remove("hidden");

loadOrders();

}

});


document.addEventListener(
"keydown",
e=>{

if(
e.key==="Enter"&&
!document
.getElementById("loginPage")
.classList
.contains("hidden")
){

loginAdmin();

}

});


setInterval(()=>{

if(
!document
.getElementById("adminPage")
.classList
.contains("hidden")
){

loadOrders();

}

},5000);

</script>

</body>
</html>
