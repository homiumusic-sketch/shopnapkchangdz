<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Quản lý đơn hàng</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f9;
      color: #222;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 25px 15px;
    }

    h1 {
      text-align: center;
      margin-bottom: 25px;
    }

    .box {
      background: #fff;
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,.08);
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 16px;
      margin-bottom: 12px;
    }

    button {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 10px;
      background: #2878e8;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:active {
      opacity: .8;
    }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    #message {
      margin-top: 12px;
      font-weight: bold;
      text-align: center;
      line-height: 1.5;
      white-space: pre-wrap;
    }

    .error {
      color: #d93025;
    }

    .success {
      color: #159447;
    }

    .order {
      background: #f8f9fb;
      border: 1px solid #ddd;
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 12px;
      line-height: 1.7;
    }

    .order-code {
      font-size: 18px;
      font-weight: bold;
      color: #2878e8;
      margin-bottom: 8px;
    }

    .content-value {
      color: #2878e8;
      font-weight: bold;
      word-break: break-word;
    }

    .paid {
      color: #159447;
      font-weight: bold;
    }

    .pending {
      color: #e09b00;
      font-weight: bold;
    }

    .empty {
      text-align: center;
      color: #777;
      padding: 20px;
    }

    .debug {
      margin-top: 12px;
      padding: 10px;
      background: #fff3f3;
      border: 1px solid #ffd0d0;
      border-radius: 8px;
      color: #b00020;
      font-size: 13px;
      white-space: pre-wrap;
      word-break: break-word;
      display: none;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>🛠️ Quản lý đơn hàng</h1>

  <div class="box">

    <label for="password">
      Mật khẩu Admin
    </label>

    <input
      type="password"
      id="password"
      placeholder="Nhập mật khẩu admin"
      autocomplete="current-password"
    >

    <button type="button" id="load">
      🔄 Xem lịch sử nạp
    </button>

    <div id="message"></div>

    <div id="debug" class="debug"></div>

  </div>


  <div class="box">

    <h2>📦 Lịch sử nạp</h2>

    <div id="orders">

      <div class="empty">
        Nhập mật khẩu rồi bấm "Xem lịch sử nạp".
      </div>

    </div>

  </div>

</div>


<script>

const loadButton =
  document.getElementById("load");

const passwordInput =
  document.getElementById("password");

const ordersBox =
  document.getElementById("orders");

const messageBox =
  document.getElementById("message");

const debugBox =
  document.getElementById("debug");

let autoRefreshTimer = null;

let isLoading = false;


/* ================================
   ESCAPE HTML
================================ */

function escapeHtml(value) {

  return String(value ?? "")

    .replace(/&/g, "&amp;")

    .replace(/</g, "&lt;")

    .replace(/>/g, "&gt;")

    .replace(/"/g, "&quot;")

    .replace(/'/g, "&#039;");

}


/* ================================
   TIỀN
================================ */

function formatMoney(amount) {

  const number =
    Number(amount);

  if (!Number.isFinite(number)) {

    return "0 VNĐ";

  }

  return number.toLocaleString("vi-VN")
    + " VNĐ";

}


/* ================================
   NGÀY
================================ */

function formatDate(date) {

  if (!date) {

    return "Chưa có";

  }

  const d =
    new Date(date);

  if (Number.isNaN(d.getTime())) {

    return escapeHtml(date);

  }

  return d.toLocaleString("vi-VN");

}


/* ================================
   TRẠNG THÁI
================================ */

function statusText(status) {

  const value =
    String(status || "")
      .toUpperCase();

  if (value === "PAID") {

    return "ĐÃ THANH TOÁN";

  }

  if (value === "PENDING") {

    return "CHỜ THANH TOÁN";

  }

  return value || "KHÔNG RÕ";

}


function statusClass(status) {

  const value =
    String(status || "")
      .toUpperCase();

  if (value === "PAID") {

    return "paid";

  }

  if (value === "PENDING") {

    return "pending";

  }

  return "";

}


/* ================================
   HIỂN THỊ LỖI
================================ */

function showDebug(text) {

  debugBox.style.display =
    "block";

  debugBox.textContent =
    text;

}


function hideDebug() {

  debugBox.style.display =
    "none";

  debugBox.textContent =
    "";

}


/* ================================
   HIỂN THỊ LỊCH SỬ NẠP
================================ */

function renderOrders(orders) {

  if (
    !Array.isArray(orders) ||
    orders.length === 0
  ) {

    ordersBox.innerHTML = `
      <div class="empty">
        Chưa có lịch sử nạp.
      </div>
    `;

    return;

  }


  ordersBox.innerHTML =
    orders.map(order => {

      const status =
        String(order.status || "");


      /*
        Nội dung chuyển khoản.
        Server hiện đang dùng:
        transfer_content
      */

      const paymentContent =
        order.transfer_content ||
        order.payment_content ||
        order.content ||
        "Chưa có";


      return `

        <div class="order">

          <div class="order-code">
            ${escapeHtml(
              order.order_code ||
              "Không có mã đơn"
            )}
          </div>


          <div>
            👤 UID:
            <strong>
              ${escapeHtml(
                order.player_id ||
                order.uid ||
                "N/A"
              )}
            </strong>
          </div>


          <div>
            🎁 Gói:
            <strong>
              ${escapeHtml(
                order.package_name ||
                order.package ||
                "N/A"
              )}
            </strong>
          </div>


          <div>
            💰 Số tiền:
            <strong>
              ${formatMoney(
                order.amount
              )}
            </strong>
          </div>


          <div>
            📝 Nội dung nạp:
            <span class="content-value">
              ${escapeHtml(
                paymentContent
              )}
            </span>
          </div>


          <div>
            📌 Trạng thái:
            <span class="${statusClass(status)}">
              ${escapeHtml(
                statusText(status)
              )}
            </span>
          </div>


          <div>
            💳 Mã giao dịch:
            ${escapeHtml(
              order.payment_id ||
              "Chưa có"
            )}
          </div>


          <div>
            🕒 Tạo lúc:
            ${escapeHtml(
              formatDate(
                order.created_at
              )
            )}
          </div>


          <div>
            ✅ Thanh toán lúc:
            ${escapeHtml(
              formatDate(
                order.paid_at
              )
            )}
          </div>

        </div>

      `;

    }).join("");

}


/* ================================
   LẤY ĐƠN HÀNG
================================ */

async function loadOrders(
  showMessage = true
) {

  const pass =
    passwordInput.value.trim();


  if (!pass) {

    messageBox.className =
      "error";

    messageBox.textContent =
      "Vui lòng nhập mật khẩu Admin.";

    ordersBox.innerHTML = `
      <div class="empty">
        Chưa nhập mật khẩu.
      </div>
    `;

    return false;

  }


  if (isLoading) {

    return false;

  }


  isLoading = true;

  loadButton.disabled = true;


  if (showMessage) {

    messageBox.className =
      "";

    messageBox.textContent =
      "Đang tải lịch sử nạp...";

    ordersBox.innerHTML = `
      <div class="empty">
        Đang tải...
      </div>
    `;

  }


  hideDebug();


  try {

    /*
      Basic Auth:
      admin + mật khẩu
    */

    const auth =
      "Basic " +
      btoa(
        "admin:" + pass
      );


    /*
      Thêm timestamp
      để tránh cache
    */

    const url =
      "/api/admin/orders?t=" +
      Date.now();


    const res =
      await fetch(
        url,
        {
          method: "GET",

          headers: {

            "Authorization": auth,

            "Accept":
              "application/json",

            "Cache-Control":
              "no-cache"

          },

          cache: "no-store"

        }
      );


    /*
      Đọc text trước
    */

    const rawText =
      await res.text();


    let result = null;


    try {

      result =
        rawText
          ? JSON.parse(rawText)
          : null;

    }

    catch {

      result = null;

    }


    /*
      HTTP ERROR
    */

    if (!res.ok) {

      if (autoRefreshTimer) {

        clearInterval(
          autoRefreshTimer
        );

        autoRefreshTimer = null;

      }


      let serverMessage = "";


      if (
        result &&
        typeof result === "object"
      ) {

        serverMessage =
          result.error ||
          result.message ||
          result.details ||
          "";

      }


      if (res.status === 401) {

        messageBox.className =
          "error";

        messageBox.textContent =
          "❌ HTTP 401: Chưa được xác thực.";

      }

      else if (
        res.status === 403
      ) {

        messageBox.className =
          "error";

        messageBox.textContent =
          "❌ HTTP 403: Sai mật khẩu Admin.";

      }

      else if (
        res.status === 404
      ) {

        messageBox.className =
          "error";

        messageBox.textContent =
          "❌ HTTP 404: Không tìm thấy /api/admin/orders.";

      }

      else if (
        res.status >= 500
      ) {

        messageBox.className =
          "error";

        messageBox.textContent =
          "❌ HTTP " +
          res.status +
          ": Server đang báo lỗi.";

      }

      else {

        messageBox.className =
          "error";

        messageBox.textContent =
          "❌ API lỗi HTTP " +
          res.status;

      }


      showDebug(

        "URL: " +
        url +
        "\n\n" +

        (
          serverMessage

            ? "Server: " +
              serverMessage

            : "Response: " +
              (rawText || "(trống)")
        )

      );


      ordersBox.innerHTML = `
        <div class="empty">
          Không thể tải lịch sử nạp.
        </div>
      `;

      return false;

    }


    /*
      SERVER trả 200
      nhưng JSON lỗi
    */

    if (!result) {

      messageBox.className =
        "error";

      messageBox.textContent =
        "❌ Server trả dữ liệu không hợp lệ.";

      showDebug(
        "Response không phải JSON:\n\n" +
        (rawText || "(trống)")
      );

      ordersBox.innerHTML = `
        <div class="empty">
          API trả dữ liệu không hợp lệ.
        </div>
      `;

      return false;

    }


    /*
      Lấy mảng orders
    */

    let orders = [];


    if (Array.isArray(result)) {

      orders = result;

    }

    else if (
      Array.isArray(
        result.orders
      )
    ) {

      orders =
        result.orders;

    }

    else if (
      Array.isArray(
        result.data
      )
    ) {

      orders =
        result.data;

    }


    /*
      Hiển thị lịch sử
    */

    renderOrders(orders);


    messageBox.className =
      "success";

    messageBox.textContent =
      "✅ Đã tải " +
      orders.length +
      " đơn hàng.";


    if (orders.length > 0) {

      console.log(
        "ADMIN ORDERS:",
        orders
      );

    }


    return true;


  }

  catch (error) {

    console.error(
      "LOAD ORDERS ERROR:",
      error
    );


    messageBox.className =
      "error";

    messageBox.textContent =
      "❌ Không thể kết nối API.";


    showDebug(
      "Lỗi JavaScript / Network:\n\n" +
      String(error)
    );


    ordersBox.innerHTML = `
      <div class="empty">
        Không thể kết nối máy chủ.
      </div>
    `;


    return false;

  }

  finally {

    isLoading = false;

    loadButton.disabled = false;

  }

}


/* ================================
   TỰ ĐỘNG CẬP NHẬT
================================ */

function startAutoRefresh() {

  if (autoRefreshTimer) {

    clearInterval(
      autoRefreshTimer
    );

  }


  autoRefreshTimer =
    setInterval(
      async () => {

        const pass =
          passwordInput.value.trim();


        if (!pass) {

          return;

        }


        await loadOrders(false);

      },

      3000

    );

}


/* ================================
   NÚT XEM LỊCH SỬ
================================ */

loadButton.addEventListener(
  "click",
  async () => {

    const success =
      await loadOrders(true);


    if (success) {

      startAutoRefresh();

    }

  }
);


/* ================================
   ENTER
================================ */

passwordInput.addEventListener(
  "keydown",
  async event => {

    if (
      event.key !== "Enter"
    ) {

      return;

    }


    event.preventDefault();


    const success =
      await loadOrders(true);


    if (success) {

      startAutoRefresh();

    }

  }
);


/* ================================
   DỌN TIMER
================================ */

window.addEventListener(
  "beforeunload",
  () => {

    if (autoRefreshTimer) {

      clearInterval(
        autoRefreshTimer
      );

    }

  }
);

</script>

</body>
</html>
