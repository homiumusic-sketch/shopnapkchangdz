<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ADMIN - Quản lý đơn nạp</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#080910;
  color:#fff;
}

.container{
  width:100%;
  max-width:1000px;
  margin:auto;
  padding:25px 15px 100px;
}

.card{
  background:#171821;
  border:1px solid #30313a;
  border-radius:22px;
  padding:25px;
  margin-bottom:20px;
}

.login-card{
  max-width:600px;
  margin:80px auto 0;
}

h1{
  text-align:center;
  color:#ffd21c;
  font-size:34px;
  margin:0 0 10px;
}

.subtitle{
  text-align:center;
  color:#aaa;
  font-size:18px;
  margin-bottom:30px;
}

label{
  display:block;
  margin:18px 0 9px;
  font-size:18px;
  font-weight:bold;
}

input{
  width:100%;
  padding:16px;
  border-radius:13px;
  border:1px solid #444;
  outline:none;
  background:#0d0e15;
  color:#fff;
  font-size:18px;
}

button{
  border:0;
  border-radius:13px;
  padding:15px 20px;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
}

button:disabled{
  opacity:.5;
  cursor:not-allowed;
}

.login-button{
  width:100%;
  margin-top:25px;
  background:linear-gradient(90deg,#ffca05,#ff7b00);
  color:#111;
  font-size:20px;
}

.logout-button{
  background:#33343d;
  color:#fff;
}

.refresh-button{
  background:#2878e8;
  color:#fff;
}

.error{
  margin-top:18px;
  padding:15px;
  border-radius:13px;
  background:#401d20;
  color:#ff7777;
  text-align:center;
}

.success{
  margin-top:18px;
  padding:15px;
  border-radius:13px;
  background:#0c3b25;
  color:#35e982;
  text-align:center;
}

.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  margin-bottom:20px;
  flex-wrap:wrap;
}

.topbar h2{
  margin:0;
  color:#ffd21c;
}

.order{
  background:#0d0e15;
  border:1px solid #333;
  border-radius:17px;
  padding:18px;
  margin-top:15px;
}

.order-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
  padding-bottom:13px;
  border-bottom:1px solid #333;
}

.order-code{
  color:#4f91ff;
  font-size:20px;
  font-weight:bold;
}

.status{
  padding:8px 13px;
  border-radius:10px;
  font-weight:bold;
}

.status-pending{
  background:#403713;
  color:#ffd21c;
}

.status-processing{
  background:#102d50;
  color:#55a3ff;
}

.status-success{
  background:#093b24;
  color:#35e982;
}

.info{
  line-height:1.9;
  color:#ddd;
  margin-top:13px;
}

.info b{
  color:#fff;
}

.actions{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-top:16px;
}

.processing-button{
  background:#2878e8;
  color:#fff;
}

.success-button{
  background:#19bd61;
  color:#fff;
}

.disabled-button{
  opacity:.5;
  cursor:not-allowed;
}

.hidden{
  display:none!important;
}

.loading{
  text-align:center;
  color:#aaa;
  padding:30px;
}

.notice{
  margin-bottom:20px;
  padding:16px;
  border-radius:14px;
  background:#30270b;
  border:1px solid #5b4a12;
  color:#ffd21c;
  line-height:1.6;
}

@media(max-width:600px){

  .container{
    padding:15px 10px 80px;
  }

  .login-card{
    margin-top:30px;
  }

  h1{
    font-size:29px;
  }

  .card{
    padding:18px;
  }

  .actions button{
    width:100%;
  }
}
</style>
</head>

<body>

<div class="container">

<!-- =========================
     LOGIN
========================= -->

<div id="loginPage" class="card login-card">

<h1>🔐 ADMIN</h1>

<div class="subtitle">
Đăng nhập để quản lý đơn nạp
</div>

<label>👤 Tài khoản admin</label>

<input
id="username"
type="text"
autocomplete="username"
placeholder="Nhập tài khoản"
>

<label>🔑 Mật khẩu</label>

<input
id="password"
type="password"
autocomplete="current-password"
placeholder="Nhập mật khẩu"
>

<button
id="loginButton"
class="login-button"
type="button"
onclick="loginAdmin()"
>
🔐 Đăng nhập
</button>

<div id="loginMessage"></div>

</div>


<!-- =========================
     ADMIN
========================= -->

<div id="adminPage" class="hidden">

<div class="topbar">

<h2>📦 QUẢN LÝ ĐƠN NẠP</h2>

<div style="display:flex;gap:10px;flex-wrap:wrap">

<button
class="refresh-button"
type="button"
onclick="loadOrders()"
>
🔄 Tải lại
</button>

<button
class="logout-button"
type="button"
onclick="logoutAdmin()"
>
🚪 Đăng xuất
</button>

</div>

</div>


<div class="notice">

⚠️ <b>Quy trình:</b><br>

Khách chuyển khoản thành công →
<b>Đang Nạp</b> →
Admin tự nạp kim cương →
Admin tự bấm <b>Thành Công</b>.

<br><br>

❗ Hệ thống không tự chuyển đơn sang
<b>Thành Công</b> chỉ vì khách đã chuyển khoản.

</div>


<div class="card">

<div id="orders">

<div class="loading">
⏳ Đang tải đơn hàng...
</div>

</div>

</div>

</div>

</div>


<script>

/* =====================================================
   API
===================================================== */

const LOGIN_API =
"/api/admin/login";

const ORDERS_API =
"/api/orders";


/* =====================================================
   TOKEN
===================================================== */

let adminToken =
localStorage.getItem(
"admin_token"
) || "";


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value){

return String(value ?? "")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* =====================================================
   ESCAPE JS
===================================================== */

function escapeJs(value){

return String(value ?? "")
.replace(/\\/g,"\\\\")
.replace(/'/g,"\\'")
.replace(/\n/g,"\\n")
.replace(/\r/g,"\\r");

}


/* =====================================================
   FORMAT DATE
===================================================== */

function formatDate(value){

if(!value){

return "Chưa có";

}

const d =
new Date(value);

if(
Number.isNaN(
d.getTime()
)
){

return String(value);

}

return d.toLocaleString(
"vi-VN"
);

}


/* =====================================================
   FORMAT MONEY
===================================================== */

function formatMoney(value){

return Number(
value || 0
).toLocaleString(
"vi-VN"
) + " VNĐ";

}


/* =====================================================
   LOGIN ERROR
===================================================== */

function showLoginError(message){

document
.getElementById(
"loginMessage"
)
.innerHTML =

`<div class="error">
❌ ${escapeHtml(message)}
</div>`;

}


/* =====================================================
   LOGIN SUCCESS
===================================================== */

function showLoginSuccess(message){

document
.getElementById(
"loginMessage"
)
.innerHTML =

`<div class="success">
✅ ${escapeHtml(message)}
</div>`;

}


/* =====================================================
   LOGIN ADMIN
===================================================== */

async function loginAdmin(){

const username =
document
.getElementById(
"username"
)
.value
.trim();


const password =
document
.getElementById(
"password"
)
.value;


const button =
document
.getElementById(
"loginButton"
);


if(!username){

showLoginError(
"Vui lòng nhập tài khoản."
);

return;

}


if(!password){

showLoginError(
"Vui lòng nhập mật khẩu."
);

return;

}


button.disabled =
true;

button.innerText =
"⏳ Đang đăng nhập...";


try{

const response =
await fetch(
LOGIN_API,
{

method:
"POST",

headers:{
"Content-Type":
"application/json",

"Accept":
"application/json"
},

credentials:
"same-origin",

body:
JSON.stringify({
username:
username,

password:
password
})

}
);


const data =
await response
.json()
.catch(
() => ({})
);


if(!response.ok){

throw new Error(
data.message ||
"Tài khoản hoặc mật khẩu không đúng."
);

}


if(!data.success){

throw new Error(
data.message ||
"Tài khoản hoặc mật khẩu không đúng."
);

}


const token =
data.token ||
data.access_token ||
data.admin_token;


if(!token){

throw new Error(
"Server không trả về token đăng nhập."
);

}


adminToken =
token;


localStorage.setItem(
"admin_token",
token
);


showLoginSuccess(
"Đăng nhập thành công."
);


setTimeout(
function(){

document
.getElementById(
"loginPage"
)
.classList
.add("hidden");


document
.getElementById(
"adminPage"
)
.classList
.remove("hidden");


loadOrders();

},
300
);


}

catch(error){

adminToken =
"";


localStorage.removeItem(
"admin_token"
);


showLoginError(
error.message ||
"Không thể đăng nhập."
);


}

finally{

button.disabled =
false;

button.innerText =
"🔐 Đăng nhập";

}

}


/* =====================================================
   AUTH HEADERS
===================================================== */

function authHeaders(){

const headers = {

"Accept":
"application/json"

};


if(adminToken){

headers["Authorization"] =
"Bearer " + adminToken;

}


return headers;

}


/* =====================================================
   LOAD ORDERS
===================================================== */

async function loadOrders(){

const box =
document
.getElementById(
"orders"
);


box.innerHTML =
`
<div class="loading">
⏳ Đang tải đơn hàng...
</div>
`;


try{

const response =
await fetch(
ORDERS_API,
{

method:
"GET",

headers:
authHeaders(),

cache:
"no-store"

}
);


if(
response.status === 401 ||
response.status === 403
){

logoutAdmin();

return;

}


const data =
await response
.json()
.catch(
() => ({})
);


if(
!response.ok ||
!data.success
){

throw new Error(
data.message ||
"Không thể tải đơn."
);

}


const orders =
Array.isArray(
data.orders
)
?
data.orders
:
[];


if(!orders.length){

box.innerHTML =
`
<div class="loading">
📭 Chưa có đơn hàng.
</div>
`;

return;

}


box.innerHTML =
orders
.map(
renderOrder
)
.join("");


}

catch(error){

box.innerHTML =
`
<div class="error">
❌ ${escapeHtml(
error.message ||
"Không thể kết nối máy chủ."
)}
</div>
`;

}

}


/* =====================================================
   RENDER ORDER
===================================================== */

function renderOrder(order){

const status =
String(
order.status || ""
)
.toUpperCase();


/*
=====================================================
TRẠNG THÁI

PAID
= khách đã thanh toán
= Đang Nạp

PROCESSING
= admin đang xử lý
= Đang Nạp

RECHARGED
= admin đã xác nhận nạp xong
= Thành Công
=====================================================
*/


let statusText =
"🟡 CHỜ THANH TOÁN";


let statusClass =
"status-pending";


if(
status === "PAID"
){

statusText =
"🟡 Đang Nạp";

statusClass =
"status-processing";

}


if(
status === "PROCESSING"
){

statusText =
"🔵 Đang Nạp";

statusClass =
"status-processing";

}


if(
status === "RECHARGED"
){

statusText =
"🟢 Thành Công";

statusClass =
"status-success";

}


/*
=====================================================
NÚT

PAID:
cho phép admin bắt đầu xử lý.

PROCESSING:
cho phép admin bấm Thành Công.

RECHARGED:
đã hoàn thành, khóa nút.
=====================================================
*/


const canStart =
status === "PAID";


const canFinish =
status === "PROCESSING";


const isFinished =
status === "RECHARGED";


return `

<div class="order">

<div class="order-header">

<div>

📦 Mã đơn:

<span class="order-code">

${escapeHtml(
order.order_code ||
"Không có"
)}

</span>

</div>


<span class="status ${statusClass}">

${statusText}

</span>

</div>


<div class="info">

🎮 ID Free Fire:

<b>
${escapeHtml(
order.player_id ||
"Không có"
)}
</b>

<br>


💎 Gói:

<b>
${escapeHtml(
order.package_name ||
"Không có"
)}
</b>

<br>


💰 Số tiền:

<b>
${formatMoney(
order.amount
)}
</b>

<br>


📝 Nội dung chuyển khoản:

<b>
${escapeHtml(
order.transfer_content ||
order.payment_content ||
order.order_code ||
"Không có"
)}
</b>

<br>


🕒 Tạo đơn:

<b>
${escapeHtml(
formatDate(
order.created_at
)
)}
</b>


${
order.paid_at
?
`
<br>

💳 Thanh toán lúc:

<b>
${escapeHtml(
formatDate(
order.paid_at
)
)}
</b>
`
:
""
}


${
order.recharged_at
?
`
<br>

💎 Thành công lúc:

<b>
${escapeHtml(
formatDate(
order.recharged_at
)
)}
</b>
`
:
""
}

</div>


<div class="actions">


<button

class="processing-button
${
!canStart
?
"disabled-button"
:
""
}
"

${
!canStart
?
"disabled"
:
""
}

type="button"

onclick="
updateStatus(
'${escapeJs(
order.order_code
)}',
'PROCESSING'
)
"

>

🔵 Đang Nạp

</button>



<button

class="success-button
${
!canFinish
?
"disabled-button"
:
""
}
"

${
!canFinish
?
"disabled"
:
""
}

type="button"

onclick="
updateStatus(
'${escapeJs(
order.order_code
)}',
'RECHARGED'
)
"

>

💎 Thành Công

</button>


</div>


${
isFinished
?
`
<div style="
margin-top:15px;
padding:13px;
border-radius:12px;
background:#063d23;
color:#35e982;
text-align:center;
font-weight:bold;
">

✅ Đơn này đã hoàn tất.

</div>
`
:
""
}


</div>

`;

}


/* =====================================================
   UPDATE STATUS
===================================================== */

async function updateStatus(
orderCode,
newStatus
){

if(!orderCode){

alert(
"Không có mã đơn hàng."
);

return;

}


/*
=====================================================
XÁC NHẬN
=====================================================
*/

let confirmText;


if(
newStatus === "PROCESSING"
){

confirmText =
"Khách đã chuyển khoản.\n\n" +
"Bạn có chắc muốn chuyển đơn này sang Đang Nạp?";

}

else if(
newStatus === "RECHARGED"
){

confirmText =
"⚠️ CHỈ BẤM OK SAU KHI BẠN ĐÃ THỰC SỰ NẠP KIM CƯƠNG CHO KHÁCH.\n\n" +
"Xác nhận đơn " +
orderCode +
" đã Thành Công?";

}

else{

confirmText =
"Xác nhận thay đổi trạng thái?";

}


if(
!confirm(
confirmText
)
){

return;

}


try{

const response =
await fetch(
ORDERS_API +
"/" +
encodeURIComponent(
orderCode
) +
"/status",
{

method:
"PATCH",

headers:{
...authHeaders(),

"Content-Type":
"application/json"
},

body:
JSON.stringify({

status:
newStatus

})

}
);


if(
response.status === 401 ||
response.status === 403
){

logoutAdmin();

return;

}


const data =
await response
.json()
.catch(
() => ({})
);


if(
!response.ok ||
!data.success
){

throw new Error(
data.message ||
"Không thể cập nhật trạng thái."
);

}


/*
=====================================================
THÔNG BÁO
=====================================================
*/

if(
newStatus === "PROCESSING"
){

alert(
"🔵 Đã chuyển đơn sang Đang Nạp."
);

}

else if(
newStatus === "RECHARGED"
){

alert(
"🟢 Đã xác nhận Thành Công."
);

}


await loadOrders();

}

catch(error){

alert(
"❌ " +
(
error.message ||
"Không thể cập nhật đơn."
)
);

}

}


/* =====================================================
   LOGOUT
===================================================== */

function logoutAdmin(){

adminToken =
"";


localStorage.removeItem(
"admin_token"
);


document
.getElementById(
"adminPage"
)
.classList
.add("hidden");


document
.getElementById(
"loginPage"
)
.classList
.remove("hidden");


document
.getElementById(
"password"
)
.value =
"";


document
.getElementById(
"loginMessage"
)
.innerHTML =
"";

}


/* =====================================================
   KIỂM TRA ĐĂNG NHẬP
===================================================== */

document.addEventListener(
"DOMContentLoaded",
function(){

if(adminToken){

document
.getElementById(
"loginPage"
)
.classList
.add("hidden");


document
.getElementById(
"adminPage"
)
.classList
.remove("hidden");


loadOrders();

}

});


/* =====================================================
   ENTER LOGIN
===================================================== */

document.addEventListener(
"keydown",
function(e){

if(
e.key === "Enter" &&
!document
.getElementById(
"loginPage"
)
.classList
.contains("hidden")
){

loginAdmin();

}

});


/* =====================================================
   TỰ ĐỘNG TẢI ĐƠN
===================================================== */

setInterval(
function(){

if(
!document
.getElementById(
"adminPage"
)
.classList
.contains("hidden")
){

loadOrders();

}

},
5000
);

</script>

</body>
</html>
