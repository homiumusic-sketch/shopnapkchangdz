<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin - Quản lý đơn nạp</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #080910;
  color: white;
}

.header {
  padding: 25px 15px;
  text-align: center;
  background: linear-gradient(135deg, #11111b, #25113e);
}

.header h1 {
  margin: 0;
  color: #ffd21c;
  font-size: 30px;
}

.header p {
  margin: 10px 0 0;
  color: #ccc;
}

.container {
  width: 100%;
  max-width: 1000px;
  margin: auto;
  padding: 20px 15px 100px;
}

.admin-box {
  background: #171821;
  padding: 20px;
  border-radius: 20px;
  margin-bottom: 20px;
}

.admin-title {
  color: #ffd21c;
  font-size: 25px;
  margin: 0 0 20px;
}

.refresh-btn {
  width: 100%;
  padding: 15px;
  border: none;
  border-radius: 13px;
  background: #2878e8;
  color: white;
  font-size: 18px;
  font-weight: bold;
  cursor: pointer;
}

.refresh-btn:active {
  transform: scale(.98);
}

.orders {
  margin-top: 20px;
}

.order {
  background: #0d0e15;
  border: 1px solid #333;
  border-radius: 18px;
  padding: 18px;
  margin-bottom: 15px;
}

.order-code {
  color: #4d8dff;
  font-size: 22px;
  font-weight: bold;
  word-break: break-all;
}

.row {
  padding: 10px 0;
  border-bottom: 1px solid #292a32;
  line-height: 1.6;
}

.row:last-child {
  border-bottom: none;
}

.label {
  color: #999;
  display: block;
  font-size: 15px;
}

.value {
  color: white;
  font-size: 18px;
  font-weight: bold;
  word-break: break-word;
}

.status {
  display: inline-block;
  margin-top: 8px;
  padding: 9px 13px;
  border-radius: 10px;
  font-weight: bold;
}

.status-paid {
  background: #123b27;
  color: #25d366;
}

.status-recharged {
  background: #063d2a;
  color: #2cff83;
}

.status-pending {
  background: #3b3210;
  color: #ffd21c;
}

.status-error {
  background: #431c1c;
  color: #ff6b6b;
}

.recharge-btn {
  width: 100%;
  margin-top: 15px;
  padding: 16px;
  border: none;
  border-radius: 13px;
  background: linear-gradient(90deg, #19c463, #08a94e);
  color: white;
  font-size: 18px;
  font-weight: bold;
  cursor: pointer;
}

.recharge-btn:disabled {
  background: #234532;
  color: #7aa98c;
  cursor: not-allowed;
}

.empty {
  text-align: center;
  padding: 30px 10px;
  color: #aaa;
}

.loading {
  text-align: center;
  padding: 25px;
  color: #ccc;
}

.error {
  padding: 15px;
  border-radius: 12px;
  background: #401d1d;
  color: #ff7777;
}

.search {
  width: 100%;
  padding: 15px;
  margin-bottom: 15px;
  border: 1px solid #444;
  border-radius: 12px;
  background: #0d0e15;
  color: white;
  font-size: 17px;
  outline: none;
}

.logout {
  width: 100%;
  margin-top: 10px;
  padding: 14px;
  border: none;
  border-radius: 12px;
  background: #33343c;
  color: white;
  font-size: 17px;
  font-weight: bold;
}

@media (max-width: 480px) {

  .header h1 {
    font-size: 26px;
  }

  .admin-title {
    font-size: 23px;
  }

  .order-code {
    font-size: 19px;
  }

  .value {
    font-size: 17px;
  }

}
</style>
</head>

<body>

<div class="header">

  <h1>🔐 QUẢN LÝ ĐƠN NẠP</h1>

  <p>
    Quản lý và xác nhận đơn nạp kim cương Free Fire
  </p>

</div>


<div class="container">

  <div class="admin-box">

    <h2 class="admin-title">
      📋 Danh sách đơn nạp
    </h2>

    <input
      id="searchInput"
      class="search"
      type="text"
      placeholder="🔎 Tìm mã đơn hoặc ID Free Fire..."
      oninput="locDonHang()"
    >

    <button
      class="refresh-btn"
      onclick="taiDonHang()"
    >
      🔄 Tải lại danh sách
    </button>

    <div
      id="orders"
      class="orders"
    >

      <div class="loading">
        ⏳ Đang tải đơn hàng...
      </div>

    </div>

  </div>


  <button
    class="logout"
    onclick="dangXuat()"
  >
    🚪 Đăng xuất Admin
  </button>

</div>


<script>

/* =====================================================
   BIẾN
===================================================== */

let allOrders = [];


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value) {

  return String(value ?? "")

    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


/* =====================================================
   FORMAT TIỀN
===================================================== */

function formatMoney(value) {

  return Number(value || 0)
    .toLocaleString("vi-VN") + " VNĐ";

}


/* =====================================================
   FORMAT NGÀY
===================================================== */

function formatDate(value) {

  if (!value) {
    return "Chưa có";
  }

  const date = new Date(value);

  if (Number.isNaN(date.getTime())) {
    return String(value);
  }

  return date.toLocaleString("vi-VN");

}


/* =====================================================
   LẤY TÊN TRẠNG THÁI
===================================================== */

function getStatus(order) {

  const status =
    String(order.status || "")
      .toUpperCase();

  if (status === "RECHARGED") {

    return `
      <span class="status status-recharged">
        🟢 ĐÃ NẠP KIM CƯƠNG
      </span>
    `;

  }

  if (status === "PAID") {

    return `
      <span class="status status-paid">
        💳 ĐÃ THANH TOÁN
      </span>
    `;

  }

  if (
    status === "PENDING" ||
    status === "UNPAID"
  ) {

    return `
      <span class="status status-pending">
        🟡 CHỜ THANH TOÁN
      </span>
    `;

  }

  return `
    <span class="status status-error">
      ⚠️ ${escapeHtml(status || "KHÔNG XÁC ĐỊNH")}
    </span>
  `;

}


/* =====================================================
   TẢI ĐƠN HÀNG
===================================================== */

async function taiDonHang() {

  const box =
    document.getElementById("orders");

  box.innerHTML = `
    <div class="loading">
      ⏳ Đang tải đơn hàng...
    </div>
  `;

  try {

    const response =
      await fetch(
        "/api/admin/orders?t=" +
        Date.now(),
        {
          method: "GET",
          cache: "no-store",
          headers: {
            "Accept": "application/json"
          }
        }
      );


    const data =
      await response.json();


    if (!response.ok) {

      throw new Error(
        data.message ||
        "Không thể tải danh sách đơn."
      );

    }


    if (
      !data.success ||
      !Array.isArray(data.orders)
    ) {

      throw new Error(
        "Server không trả về danh sách đơn."
      );

    }


    allOrders = data.orders;

    hienThiDonHang(allOrders);

  }

  catch (error) {

    console.error(
      "ADMIN ORDERS ERROR:",
      error
    );

    box.innerHTML = `
      <div class="error">
        ❌ ${escapeHtml(
          error.message ||
          "Không thể kết nối máy chủ."
        )}
      </div>
    `;

  }

}


/* =====================================================
   HIỂN THỊ ĐƠN
===================================================== */

function hienThiDonHang(orders) {

  const box =
    document.getElementById("orders");


  if (
    !orders ||
    orders.length === 0
  ) {

    box.innerHTML = `
      <div class="empty">
        📭 Chưa có đơn hàng nào.
      </div>
    `;

    return;

  }


  box.innerHTML =
    orders.map(function(order) {

      const status =
        String(
          order.status || ""
        ).toUpperCase();


      /*
        Chỉ cho xác nhận khi
        đơn đã thanh toán.
      */

      const canRecharge =
        status === "PAID";


      const recharged =
        status === "RECHARGED";


      let button = "";


      if (recharged) {

        button = `
          <button
            class="recharge-btn"
            disabled
          >
            ✅ ĐÃ XÁC NHẬN NẠP KIM CƯƠNG
          </button>
        `;

      }

      else if (canRecharge) {

        button = `
          <button
            class="recharge-btn"
            onclick="xacNhanNap(
              '${escapeJs(order.order_code)}'
            )"
          >
            💎 XÁC NHẬN ĐÃ NẠP KIM CƯƠNG
          </button>
        `;

      }

      else {

        button = `
          <button
            class="recharge-btn"
            disabled
          >
            ⏳ Chưa thể xác nhận
          </button>
        `;

      }


      return `

        <div
          class="order"
          data-order-code="${escapeHtml(
            order.order_code
          )}"
          data-player-id="${escapeHtml(
            order.player_id
          )}"
        >

          <div class="row">

            <span class="label">
              📦 Mã đơn hàng
            </span>

            <div class="order-code">
              ${escapeHtml(
                order.order_code
              )}
            </div>

          </div>


          <div class="row">

            <span class="label">
              🎮 ID Free Fire
            </span>

            <div class="value">
              ${escapeHtml(
                order.player_id
              )}
            </div>

          </div>


          <div class="row">

            <span class="label">
              💎 Gói
            </span>

            <div class="value">
              ${escapeHtml(
                order.package_name
              )}
            </div>

          </div>


          <div class="row">

            <span class="label">
              💰 Số tiền
            </span>

            <div class="value">
              ${formatMoney(
                order.amount
              )}
            </div>

          </div>


          <div class="row">

            <span class="label">
              📝 Nội dung chuyển khoản
            </span>

            <div class="value">
              ${escapeHtml(
                order.transfer_content ||
                order.payment_content ||
                "Chưa có"
              )}
            </div>

          </div>


          <div class="row">

            <span class="label">
              💳 Mã giao dịch
            </span>

            <div class="value">
              ${escapeHtml(
                order.payment_id ||
                "Chưa có"
              )}
            </div>

          </div>


          <div class="row">

            <span class="label">
              📅 Tạo đơn
            </span>

            <div class="value">
              ${formatDate(
                order.created_at
              )}
            </div>

          </div>


          <div class="row">

            <span class="label">
              📊 Trạng thái
            </span>

            ${getStatus(order)}

          </div>


          ${button}

        </div>

      `;

    }).join("");

}


/* =====================================================
   XÁC NHẬN ĐÃ NẠP KIM CƯƠNG
===================================================== */

async function xacNhanNap(orderCode) {

  if (!orderCode) {
    return;
  }


  const confirmAction =
    confirm(
      "Bạn chắc chắn đã nạp kim cương cho khách?\n\n" +
      "Mã đơn: " +
      orderCode
    );


  if (!confirmAction) {
    return;
  }


  try {

    const response =
      await fetch(
        "/api/admin/orders/" +
        encodeURIComponent(
          orderCode
        ) +
        "/recharge",
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json",

            "Accept":
              "application/json"
          },

          body: JSON.stringify({
            status: "RECHARGED"
          })
        }
      );


    const data =
      await response.json();


    if (!response.ok) {

      throw new Error(
        data.message ||
        "Không thể xác nhận đơn."
      );

    }


    if (!data.success) {

      throw new Error(
        data.message ||
        "Xác nhận thất bại."
      );

    }


    alert(
      "✅ Đã xác nhận nạp kim cương!\n\n" +
      "Mã đơn: " +
      orderCode
    );


    /*
      Tải lại danh sách.
      Khách tra mã đơn sẽ nhận
      status = RECHARGED.
    */

    await taiDonHang();

  }

  catch (error) {

    console.error(
      "RECHARGE ERROR:",
      error
    );


    alert(
      "❌ " +
      (
        error.message ||
        "Không thể kết nối máy chủ."
      )
    );

  }

}


/* =====================================================
   TÌM KIẾM
===================================================== */

function locDonHang() {

  const keyword =
    document
      .getElementById(
        "searchInput"
      )
      .value
      .trim()
      .toLowerCase();


  if (!keyword) {

    hienThiDonHang(
      allOrders
    );

    return;

  }


  const filtered =
    allOrders.filter(
      function(order) {

        const orderCode =
          String(
            order.order_code || ""
          ).toLowerCase();


        const playerId =
          String(
            order.player_id || ""
          ).toLowerCase();


        return (
          orderCode.includes(keyword) ||
          playerId.includes(keyword)
        );

      }
    );


  hienThiDonHang(
    filtered
  );

}


/* =====================================================
   ESCAPE JS
===================================================== */

function escapeJs(value) {

  return String(value ?? "")
    .replace(/\\/g, "\\\\")
    .replace(/'/g, "\\'")
    .replace(/"/g, '\\"')
    .replace(/\n/g, "\\n")
    .replace(/\r/g, "\\r");

}


/* =====================================================
   ĐĂNG XUẤT
===================================================== */

function dangXuat() {

  /*
    Nếu hệ thống của bạn có
    API logout thì đổi URL tại đây.
  */

  fetch(
    "/api/admin/logout",
    {
      method: "POST"
    }
  )
  .finally(function() {

    window.location.href =
      "/admin.html";

  });

}


/* =====================================================
   TỰ TẢI KHI MỞ TRANG
===================================================== */

taiDonHang();


/* =====================================================
   TỰ CẬP NHẬT MỖI 5 GIÂY
===================================================== */

setInterval(
  function() {

    taiDonHang();

  },
  5000
);

</script>

</body>
</html>
