<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quản lý đơn hàng</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f9;
      color: #222;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 25px 15px;
    }

    h1 {
      text-align: center;
      margin-bottom: 25px;
    }

    .box {
      background: #fff;
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 16px;
      margin-bottom: 12px;
    }

    button {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 10px;
      background: #2878e8;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:active {
      opacity: 0.8;
    }

    button:disabled {
      opacity: 0.6;
    }

    #message {
      margin-top: 12px;
      font-weight: bold;
      text-align: center;
    }

    .error {
      color: #d93025;
    }

    .success {
      color: #159447;
    }

    .order {
      background: #f8f9fb;
      border: 1px solid #ddd;
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 12px;
      line-height: 1.7;
    }

    .order-code {
      font-size: 18px;
      font-weight: bold;
      color: #2878e8;
      margin-bottom: 8px;
    }

    .paid {
      color: #159447;
      font-weight: bold;
    }

    .pending {
      color: #e09b00;
      font-weight: bold;
    }

    .empty {
      text-align: center;
      color: #777;
      padding: 20px;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>🛠️ Quản lý đơn hàng</h1>

    <div class="box">

      <label for="password">
        Mật khẩu Admin
      </label>

      <input
        type="password"
        id="password"
        placeholder="Nhập mật khẩu admin"
        autocomplete="current-password"
      >

      <button type="button" id="load">
        🔄 Xem đơn hàng
      </button>

      <div id="message"></div>

    </div>

    <div class="box">

      <h2>📦 Danh sách đơn hàng</h2>

      <div id="orders">
        <div class="empty">
          Nhập mật khẩu rồi bấm "Xem đơn hàng".
        </div>
      </div>

    </div>

  </div>


  <script>

    const loadButton =
      document.getElementById("load");

    const passwordInput =
      document.getElementById("password");

    const ordersBox =
      document.getElementById("orders");

    const messageBox =
      document.getElementById("message");

    let autoRefreshTimer = null;


    // ================================
    // CHỐNG HTML INJECTION
    // ================================

    function escapeHtml(value) {

      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }


    // ================================
    // ĐỊNH DẠNG TIỀN
    // ================================

    function formatMoney(amount) {

      return Number(amount || 0)
        .toLocaleString("vi-VN") + " VNĐ";

    }


    // ================================
    // ĐỊNH DẠNG NGÀY
    // ================================

    function formatDate(date) {

      if (!date) {
        return "Chưa có";
      }

      try {

        return new Date(date)
          .toLocaleString("vi-VN");

      } catch {

        return String(date);

      }

    }


    // ================================
    // TRẠNG THÁI
    // ================================

    function statusText(status) {

      if (status === "PAID") {
        return "ĐÃ THANH TOÁN";
      }

      if (status === "PENDING") {
        return "CHỜ THANH TOÁN";
      }

      return status || "KHÔNG RÕ";

    }


    function statusClass(status) {

      if (status === "PAID") {
        return "paid";
      }

      if (status === "PENDING") {
        return "pending";
      }

      return "";

    }


    // ================================
    // HIỂN THỊ ĐƠN
    // ================================

    function renderOrders(orders) {

      if (!Array.isArray(orders) || orders.length === 0) {

        ordersBox.innerHTML =
          '<div class="empty">Chưa có đơn hàng.</div>';

        return;

      }


      ordersBox.innerHTML = orders.map(order => {

        const status =
          String(order.status || "");


        return `

          <div class="order">

            <div class="order-code">
              ${escapeHtml(
                order.order_code ||
                "Không có mã đơn"
              )}
            </div>

            <div>
              👤 UID:
              <strong>
                ${escapeHtml(
                  order.player_id || "N/A"
                )}
              </strong>
            </div>

            <div>
              🎁 Gói:
              <strong>
                ${escapeHtml(
                  order.package_name || "N/A"
                )}
              </strong>
            </div>

            <div>
              💰 Số tiền:
              <strong>
                ${formatMoney(order.amount)}
              </strong>
            </div>

            <div>
              📌 Trạng thái:
              <span class="${statusClass(status)}">
                ${escapeHtml(statusText(status))}
              </span>
            </div>

            <div>
              💳 Mã giao dịch:
              ${escapeHtml(
                order.payment_id || "Chưa có"
              )}
            </div>

            <div>
              🕒 Tạo lúc:
              ${escapeHtml(
                formatDate(order.created_at)
              )}
            </div>

            <div>
              ✅ Thanh toán lúc:
              ${escapeHtml(
                formatDate(order.paid_at)
              )}
            </div>

          </div>

        `;

      }).join("");

    }


    // ================================
    // LẤY DANH SÁCH ĐƠN
    // ================================

    async function loadOrders(showMessage = true) {

      const pass =
        passwordInput.value.trim();


      if (!pass) {

        if (showMessage) {

          messageBox.className = "error";

          messageBox.textContent =
            "Vui lòng nhập mật khẩu admin.";

        }

        return false;

      }


      if (showMessage) {

        messageBox.className = "";

        messageBox.textContent =
          "Đang tải đơn hàng...";

        ordersBox.innerHTML =
          '<div class="empty">Đang tải...</div>';

      }


      try {

        const auth =
          "Basic " +
          btoa("admin:" + pass);


        const res =
          await fetch(
            "/api/admin/orders",
            {
              method: "GET",

              headers: {
                "Authorization": auth,
                "Accept": "application/json"
              },

              cache: "no-store"
            }
          );


        // ================================
        // KIỂM TRA LỖI ĐĂNG NHẬP
        // ================================

        if (!res.ok) {

          if (autoRefreshTimer) {

            clearInterval(autoRefreshTimer);

            autoRefreshTimer = null;

          }


          if (res.status === 401) {

            messageBox.className = "error";

            messageBox.textContent =
              "Chưa được xác thực.";

          } else if (res.status === 403) {

            messageBox.className = "error";

            messageBox.textContent =
              "Sai mật khẩu Admin.";

          } else {

            messageBox.className = "error";

            messageBox.textContent =
              "Lỗi máy chủ: HTTP " + res.status;

          }


          ordersBox.innerHTML =
            '<div class="empty">Không thể tải đơn hàng.</div>';

          return false;

        }


        // ================================
        // ĐỌC JSON
        // ================================

        const result =
          await res.json();


        const orders =
          Array.isArray(result)
            ? result
            : (
                Array.isArray(result.orders)
                  ? result.orders
                  : []
              );


        renderOrders(orders);


        messageBox.className = "success";

        messageBox.textContent =
          "Đã tải " +
          orders.length +
          " đơn hàng.";


        return true;


      } catch (error) {

        console.error(
          "LOAD ORDERS ERROR:",
          error
        );


        messageBox.className = "error";

        messageBox.textContent =
          "Không thể kết nối máy chủ.";


        ordersBox.innerHTML =
          '<div class="empty">Kiểm tra Render/server.js.</div>';


        return false;

      }

    }


    // ================================
    // TỰ ĐỘNG CẬP NHẬT 3 GIÂY
    // ================================

    function startAutoRefresh() {

      if (autoRefreshTimer) {

        clearInterval(autoRefreshTimer);

      }


      autoRefreshTimer =
        setInterval(async () => {

          const pass =
            passwordInput.value.trim();


          if (!pass) {
            return;
          }


          await loadOrders(false);

        }, 3000);

    }


    // ================================
    // NÚT XEM ĐƠN HÀNG
    // ================================

    loadButton.addEventListener(
      "click",
      async () => {

        const success =
          await loadOrders(true);


        if (success) {

          startAutoRefresh();

        }

      }
    );


    // ================================
    // NHẤN ENTER
    // ================================

    passwordInput.addEventListener(
      "keydown",
      async (event) => {

        if (event.key === "Enter") {

          event.preventDefault();


          const success =
            await loadOrders(true);


          if (success) {

            startAutoRefresh();

          }

        }

      }
    );


  </script>

</body>
</html>
