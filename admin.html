<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin - Quản lý nạp Free Fire</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #080910;
  color: white;
}

.header {
  padding: 22px 15px;
  text-align: center;
  background: linear-gradient(135deg, #11111b, #25113e);
}

.header h1 {
  margin: 0;
  color: #ffd21c;
  font-size: 27px;
}

.header p {
  margin: 8px 0 0;
  color: #aaa;
}

.container {
  width: 100%;
  max-width: 1000px;
  margin: auto;
  padding: 20px 15px 80px;
}

/* LOGIN */

.login-box {
  max-width: 450px;
  margin: 50px auto;
  padding: 25px;
  background: #171821;
  border-radius: 22px;
}

.login-box h2 {
  margin-top: 0;
  text-align: center;
  color: #ffd21c;
}

.login-box input {
  width: 100%;
  padding: 15px;
  margin-top: 12px;
  border: 1px solid #444;
  border-radius: 12px;
  outline: none;
  background: #0d0e15;
  color: white;
  font-size: 17px;
}

.login-btn {
  width: 100%;
  margin-top: 15px;
  padding: 15px;
  border: none;
  border-radius: 12px;
  background: linear-gradient(90deg,#ffca05,#ff7b00);
  color: #111;
  font-size: 18px;
  font-weight: bold;
}

/* ADMIN */

#adminPanel {
  display: none;
}

.toolbar {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin-bottom: 20px;
}

.search {
  flex: 1;
  min-width: 220px;
  padding: 14px;
  border: 1px solid #444;
  border-radius: 12px;
  background: #171821;
  color: white;
  font-size: 16px;
}

.reload-btn {
  padding: 14px 18px;
  border: none;
  border-radius: 12px;
  background: #2878e8;
  color: white;
  font-weight: bold;
}

/* ORDER */

.order-card {
  background: #171821;
  border: 1px solid #333;
  border-radius: 20px;
  padding: 20px;
  margin-bottom: 15px;
}

.order-head {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 15px;
  flex-wrap: wrap;
  padding-bottom: 15px;
  border-bottom: 1px solid #333;
}

.order-code {
  color: #4d8dff;
  font-size: 21px;
  font-weight: bold;
  word-break: break-word;
}

.status {
  padding: 9px 13px;
  border-radius: 10px;
  font-weight: bold;
}

.status-pending {
  background: #514016;
  color: #ffd21c;
}

.status-paid {
  background: #173d2a;
  color: #45e681;
}

.status-topup {
  background: #143f2c;
  color: #42ef91;
}

.info {
  margin-top: 15px;
}

.info-row {
  display: flex;
  justify-content: space-between;
  gap: 15px;
  padding: 11px 0;
  border-bottom: 1px solid #292a33;
}

.info-row:last-child {
  border-bottom: none;
}

.info-label {
  color: #aaa;
}

.info-value {
  color: white;
  font-weight: bold;
  text-align: right;
  word-break: break-word;
}

.transfer-content {
  color: #ffd21c;
}

.actions {
  margin-top: 18px;
}

.topup-btn {
  width: 100%;
  padding: 15px;
  border: none;
  border-radius: 12px;
  background: linear-gradient(90deg,#20c96b,#0ca956);
  color: white;
  font-size: 17px;
  font-weight: bold;
}

.topup-btn:disabled {
  opacity: .55;
  cursor: not-allowed;
}

.logout-btn {
  margin-top: 20px;
  width: 100%;
  padding: 13px;
  border: none;
  border-radius: 12px;
  background: #292a33;
  color: white;
  font-weight: bold;
}

.message {
  margin: 15px 0;
  padding: 14px;
  border-radius: 12px;
  display: none;
  background: #292a33;
}

.empty {
  padding: 35px;
  text-align: center;
  background: #171821;
  border-radius: 18px;
  color: #aaa;
}

@media(max-width:600px) {

  .header h1 {
    font-size: 23px;
  }

  .info-row {
    flex-direction: column;
    gap: 5px;
  }

  .info-value {
    text-align: left;
  }

  .order-head {
    flex-direction: column;
  }
}
</style>
</head>

<body>

<div class="header">
  <h1>🛠️ QUẢN LÝ NẠP FREE FIRE</h1>
  <p>Trang quản trị đơn hàng</p>
</div>

<div class="container">

  <!-- LOGIN -->

  <div id="loginBox" class="login-box">

    <h2>🔐 Đăng nhập Admin</h2>

    <input
      id="username"
      type="text"
      placeholder="Tên tài khoản"
      autocomplete="username"
    >

    <input
      id="password"
      type="password"
      placeholder="Mật khẩu"
      autocomplete="current-password"
    >

    <button
      class="login-btn"
      onclick="loginAdmin()"
    >
      Đăng nhập
    </button>

    <div id="loginMessage" class="message"></div>

  </div>


  <!-- ADMIN PANEL -->

  <div id="adminPanel">

    <div class="toolbar">

      <input
        id="searchInput"
        class="search"
        type="text"
        placeholder="🔎 Tìm ID Free Fire hoặc mã đơn..."
        oninput="renderOrders()"
      >

      <button
        class="reload-btn"
        onclick="loadOrders()"
      >
        🔄 Tải lại
      </button>

    </div>

    <div id="message" class="message"></div>

    <div id="ordersList"></div>

    <button
      class="logout-btn"
      onclick="logoutAdmin()"
    >
      🚪 Đăng xuất
    </button>

  </div>

</div>


<script>

/* =====================================================
   ADMIN AUTH
   ===================================================== */

let authHeader = "";

let allOrders = [];


/* =====================================================
   LOGIN
   ===================================================== */

function loginAdmin() {

  const username =
    document.getElementById("username").value.trim();

  const password =
    document.getElementById("password").value;

  if (!username || !password) {

    showLoginMessage(
      "Vui lòng nhập tài khoản và mật khẩu."
    );

    return;
  }

  /*
    Server hiện tại của bạn đang yêu cầu:

    username = admin

    password = ADMIN_PASSWORD
  */

  authHeader =
    "Basic " +
    btoa(username + ":" + password);

  checkLogin();

}


/* =====================================================
   KIỂM TRA ĐĂNG NHẬP
   ===================================================== */

async function checkLogin() {

  try {

    const response =
      await fetch(
        "/api/admin/orders",
        {
          headers: {
            "Authorization": authHeader
          }
        }
      );

    if (response.status === 401) {

      showLoginMessage(
        "Sai tài khoản hoặc mật khẩu."
      );

      authHeader = "";

      return;
    }

    if (response.status === 403) {

      showLoginMessage(
        "Sai mật khẩu hoặc không được phép."
      );

      authHeader = "";

      return;
    }

    if (!response.ok) {

      showLoginMessage(
        "Không thể kết nối máy chủ."
      );

      return;
    }

    const data =
      await response.json();

    allOrders =
      data.orders || [];

    document
      .getElementById("loginBox")
      .style.display = "none";

    document
      .getElementById("adminPanel")
      .style.display = "block";

    renderOrders();

  } catch (error) {

    console.error(error);

    showLoginMessage(
      "Không thể kết nối máy chủ."
    );
  }

}


/* =====================================================
   LOAD ORDERS
   ===================================================== */

async function loadOrders() {

  if (!authHeader) return;

  try {

    const response =
      await fetch(
        "/api/admin/orders",
        {
          headers: {
            "Authorization": authHeader
          }
        }
      );

    if (response.status === 401 ||
        response.status === 403) {

      logoutAdmin();

      return;
    }

    const data =
      await response.json();

    if (!data.success) {

      showMessage(
        data.message ||
        "Không thể tải đơn hàng."
      );

      return;
    }

    allOrders =
      data.orders || [];

    renderOrders();

  } catch (error) {

    console.error(error);

    showMessage(
      "Không thể tải danh sách đơn."
    );
  }

}


/* =====================================================
   HIỂN THỊ ĐƠN
   ===================================================== */

function renderOrders() {

  const container =
    document.getElementById("ordersList");

  const keyword =
    document
      .getElementById("searchInput")
      .value
      .trim()
      .toLowerCase();

  const filtered =
    allOrders.filter(order => {

      const playerId =
        String(
          order.player_id ||
          order.ff_id ||
          ""
        ).toLowerCase();

      const orderCode =
        String(
          order.order_code ||
          ""
        ).toLowerCase();

      return (
        !keyword ||
        playerId.includes(keyword) ||
        orderCode.includes(keyword)
      );

    });


  if (!filtered.length) {

    container.innerHTML = `
      <div class="empty">
        📭 Không có đơn hàng.
      </div>
    `;

    return;
  }


  container.innerHTML =
    filtered.map(order => {

      return createOrderCard(order);

    }).join("");

}


/* =====================================================
   TẠO CARD
   ===================================================== */

function createOrderCard(order) {

  const orderCode =
    escapeHtml(
      order.order_code || "---"
    );

  const playerId =
    escapeHtml(
      order.player_id ||
      order.ff_id ||
      "---"
    );

  const packageName =
    escapeHtml(
      order.package_name ||
      "---"
    );

  const amount =
    Number(order.amount || 0)
      .toLocaleString("vi-VN") +
    " VNĐ";


  const transferContent =
    escapeHtml(
      order.payment_content ||
      order.transfer_content ||
      "---"
    );


  /*
    Trạng thái thanh toán
  */

  const paymentStatus =
    String(
      order.status ||
      order.payment_status ||
      "PENDING"
    );


  /*
    Trạng thái nạp kim cương.

    Hệ thống có thể dùng:
    TOPPED_UP
    TOPUP_SUCCESS
    SUCCESS
    TOPUP_COMPLETED
  */

  const topupStatus =
    String(
      order.topup_status ||
      ""
    ).toUpperCase();


  let statusText =
    "⏳ Chờ thanh toán";

  let statusClass =
    "status-pending";


  if (
    paymentStatus === "PAID" ||
    paymentStatus === "SUCCESS"
  ) {

    statusText =
      "💳 Đã thanh toán";

    statusClass =
      "status-paid";
  }


  if (
    topupStatus === "TOPPED_UP" ||
    topupStatus === "TOPUP_SUCCESS" ||
    topupStatus === "SUCCESS" ||
    topupStatus === "TOPUP_COMPLETED"
  ) {

    statusText =
      "💎 Đã nạp kim cương";

    statusClass =
      "status-topup";
  }


  const alreadyTopup =
    topupStatus === "TOPPED_UP" ||
    topupStatus === "TOPUP_SUCCESS" ||
    topupStatus === "SUCCESS" ||
    topupStatus === "TOPUP_COMPLETED";


  return `
    <div class="order-card">

      <div class="order-head">

        <div>
          <div style="color:#aaa;font-size:14px">
            📦 Mã đơn hàng
          </div>

          <div class="order-code">
            ${orderCode}
          </div>
        </div>

        <div class="status ${statusClass}">
          ${statusText}
        </div>

      </div>


      <div class="info">

        <div class="info-row">

          <span class="info-label">
            🎮 ID Free Fire
          </span>

          <b class="info-value">
            ${playerId}
          </b>

        </div>


        <div class="info-row">

          <span class="info-label">
            💎 Gói
          </span>

          <b class="info-value">
            ${packageName}
          </b>

        </div>


        <div class="info-row">

          <span class="info-label">
            💰 Số tiền
          </span>

          <b class="info-value">
            ${amount}
          </b>

        </div>


        <div class="info-row">

          <span class="info-label">
            📝 Nội dung chuyển khoản
          </span>

          <b class="info-value transfer-content">
            ${transferContent}
          </b>

        </div>


        <div class="info-row">

          <span class="info-label">
            🕐 Tạo đơn
          </span>

          <b class="info-value">
            ${escapeHtml(
              order.created_at || "---"
            )}
          </b>

        </div>


        ${
          order.paid_at
          ? `
            <div class="info-row">

              <span class="info-label">
                💳 Thanh toán lúc
              </span>

              <b class="info-value">
                ${escapeHtml(order.paid_at)}
              </b>

            </div>
          `
          : ""
        }


        ${
          order.topped_up_at
          ? `
            <div class="info-row">

              <span class="info-label">
                💎 Nạp kim cương lúc
              </span>

              <b class="info-value">
                ${escapeHtml(order.topped_up_at)}
              </b>

            </div>
          `
          : ""
        }

      </div>


      <div class="actions">

        ${
          alreadyTopup

          ? `
            <button
              class="topup-btn"
              disabled
            >
              💎 Đã nạp kim cương
            </button>
          `

          : `
            <button
              class="topup-btn"
              onclick="confirmTopup(
                '${escapeJs(orderCode)}'
              )"
            >
              💎 Xác nhận đã nạp kim cương
            </button>
          `
        }

      </div>

    </div>
  `;
}


/* =====================================================
   XÁC NHẬN ĐÃ NẠP KIM CƯƠNG
   ===================================================== */

async function confirmTopup(orderCode) {

  const ok =
    confirm(
      "Bạn đã thực sự nạp kim cương vào nick khách chưa?"
    );

  if (!ok) return;


  try {

    const response =
      await fetch(
        "/api/admin/orders/" +
        encodeURIComponent(orderCode) +
        "/topup",
        {
          method: "POST",

          headers: {
            "Authorization": authHeader,
            "Content-Type": "application/json"
          }
        }
      );


    if (response.status === 401 ||
        response.status === 403) {

      alert(
        "Phiên đăng nhập đã hết."
      );

      logoutAdmin();

      return;
    }


    const data =
      await response.json();


    if (!data.success) {

      alert(
        data.message ||
        "Không thể xác nhận."
      );

      return;
    }


    alert(
      "💎 Đã xác nhận nạp kim cương thành công!"
    );


    await loadOrders();

  } catch (error) {

    console.error(error);

    alert(
      "Không thể kết nối máy chủ."
    );
  }

}


/* =====================================================
   LOGOUT
   ===================================================== */

function logoutAdmin() {

  authHeader = "";

  allOrders = [];

  document
    .getElementById("adminPanel")
    .style.display = "none";

  document
    .getElementById("loginBox")
    .style.display = "block";

  document
    .getElementById("password")
    .value = "";

}


/* =====================================================
   MESSAGE
   ===================================================== */

function showLoginMessage(text) {

  const el =
    document.getElementById(
      "loginMessage"
    );

  el.innerText = text;
  el.style.display = "block";

}


function showMessage(text) {

  const el =
    document.getElementById(
      "message"
    );

  el.innerText = text;
  el.style.display = "block";

  setTimeout(() => {

    el.style.display = "none";

  }, 4000);

}


/* =====================================================
   ESCAPE HTML
   ===================================================== */

function escapeHtml(value) {

  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}


function escapeJs(value) {

  return String(value ?? "")
    .replace(/\\/g, "\\\\")
    .replace(/'/g, "\\'");
}


/* =====================================================
   ENTER ĐỂ ĐĂNG NHẬP
   ===================================================== */

document
  .getElementById("password")
  .addEventListener(
    "keydown",
    function(event) {

      if (event.key === "Enter") {
        loginAdmin();
      }

    }
  );

</script>

</body>
</html>
