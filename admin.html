<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin - Quản lý đơn nạp</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#080910;
  color:#fff;
}

.wrap{
  max-width:1050px;
  margin:auto;
  padding:18px;
}

.card{
  background:#171821;
  border:1px solid #30313b;
  border-radius:18px;
  padding:20px;
  margin-bottom:18px;
}

h1,h2{
  margin-top:0;
  color:#ffd21c;
}

input{
  width:100%;
  padding:15px;
  border-radius:12px;
  border:1px solid #444;
  background:#0d0e15;
  color:#fff;
  font-size:17px;
  outline:none;
  margin:7px 0 12px;
}

button{
  border:0;
  border-radius:11px;
  padding:12px 15px;
  font-weight:bold;
  cursor:pointer;
  font-size:15px;
}

.login{
  max-width:480px;
  margin:60px auto;
}

.login button{
  width:100%;
  background:linear-gradient(90deg,#ffca05,#ff7b00);
  font-size:18px;
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  flex-wrap:wrap;
}

.refresh{
  background:#2878e8;
  color:#fff;
}

.logout{
  background:#333;
  color:#fff;
}

.order{
  background:#0e0f16;
  border:1px solid #333;
  border-radius:16px;
  padding:17px;
  margin-top:12px;
}

.order-head{
  display:flex;
  justify-content:space-between;
  gap:10px;
  align-items:center;
  flex-wrap:wrap;
}

.code{
  font-size:18px;
  font-weight:bold;
  color:#55a3ff;
}

.badge{
  padding:9px 12px;
  border-radius:10px;
  font-weight:bold;
}

.pending{
  background:#403713;
  color:#ffd21c;
}

.payment-received{
  background:#3b2f08;
  color:#ffc107;
}

.processing{
  background:#102d50;
  color:#55a3ff;
}

.paid{
  background:#063d23;
  color:#25d366;
}

.info{
  line-height:1.9;
  color:#ddd;
  margin-top:10px;
}

.actions{
  margin-top:15px;
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.processing-btn{
  background:#2878e8;
  color:#fff;
}

.paid-btn{
  background:#19bd61;
  color:#fff;
}

button:disabled{
  opacity:.45;
  cursor:not-allowed;
}

.empty{
  text-align:center;
  color:#aaa;
  padding:30px;
}

.error{
  background:#401d20;
  color:#ff7777;
  padding:13px;
  border-radius:10px;
  margin-top:10px;
}

.hidden{
  display:none;
}

.small{
  color:#aaa;
}

.notice{
  margin-top:15px;
  padding:14px;
  border-radius:12px;
  background:#30270b;
  color:#ffd21c;
  line-height:1.5;
}

@media(max-width:600px){
  .wrap{
    padding:12px;
  }

  .card{
    padding:16px;
  }

  .actions button{
    width:100%;
  }
}
</style>
</head>

<body>

<div class="wrap">

<!-- LOGIN -->
<div id="loginBox" class="card login">

  <h1>🔐 ADMIN LOGIN</h1>

  <p class="small">
    Đăng nhập để quản lý đơn nạp Free Fire
  </p>

  <input
    id="username"
    type="text"
    placeholder="Tài khoản admin"
    autocomplete="username"
  >

  <input
    id="password"
    type="password"
    placeholder="Mật khẩu admin"
    autocomplete="current-password"
  >

  <button onclick="login()">
    🔐 ĐĂNG NHẬP ADMIN
  </button>

  <div id="loginError"></div>

</div>


<!-- ADMIN -->
<div id="adminPanel" class="hidden">

  <div class="card">

    <div class="top">

      <div>
        <h1>📦 QUẢN LÝ ĐƠN NẠP</h1>

        <div class="small">
          Admin tự xác nhận từng bước.
