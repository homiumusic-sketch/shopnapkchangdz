<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin - Quản lý nạp</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #080910;
  color: white;
}

.header {
  padding: 25px 15px;
  text-align: center;
  background: linear-gradient(135deg, #11111b, #25113e);
}

.header h1 {
  margin: 0;
  color: #ffd21c;
}

.header p {
  color: #ccc;
}

.container {
  width: 100%;
  max-width: 1100px;
  margin: auto;
  padding: 20px 15px 80px;
}

.login-box,
.admin-box {
  background: #171821;
  padding: 20px;
  border-radius: 18px;
  margin-bottom: 20px;
}

.login-box h2,
.admin-box h2 {
  margin-top: 0;
  color: #ffd21c;
}

input {
  width: 100%;
  padding: 14px;
  margin: 7px 0;
  border: 1px solid #444;
  border-radius: 10px;
  background: #0d0e15;
  color: white;
  font-size: 16px;
}

button {
  border: none;
  border-radius: 10px;
  padding: 12px 16px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

.login-btn {
  width: 100%;
  margin-top: 10px;
  background: linear-gradient(90deg,#ffca05,#ff7b00);
  color: #111;
}

.reload-btn {
  background: #2878e8;
  color: white;
}

.logout-btn {
  background: #555;
  color: white;
  margin-left: 8px;
}

.search-box {
  margin: 20px 0;
}

.order {
  background: #101119;
  border: 1px solid #333;
  border-radius: 16px;
  padding: 18px;
  margin-bottom: 15px;
}

.order-row {
  display: flex;
  justify-content: space-between;
  gap: 15px;
  padding: 7px 0;
  border-bottom: 1px solid #24252d;
}

.order-row:last-child {
  border-bottom: none;
}

.label {
  color: #aaa;
}

.value {
  text-align: right;
  font-weight: bold;
  word-break: break-word;
}

.pending {
  color: #ffd21c;
}

.paid {
  color: #38e878;
}

.success {
  color: #38e878;
}

.waiting {
  color: #ffd21c;
}

.confirm-btn {
  width: 100%;
  margin-top: 15px;
  background: #20b95b;
  color: white;
}

.confirm-btn:disabled {
  background: #555;
  cursor: not-allowed;
}

.message {
  padding: 12px;
  border-radius: 10px;
  margin: 10px 0;
  display: none;
}

.message.show {
  display: block;
}

.empty {
  text-align: center;
  color: #aaa;
  padding: 30px;
}

@media(max-width:600px) {
  .order-row {
    flex-direction: column;
    gap: 3px;
  }

  .value {
    text-align: left;
  }

  .logout-btn {
    margin-left: 0;
    margin-top: 8px;
  }
}
</style>
</head>

<body>

<div class="header">
  <h1>🔐 QUẢN LÝ NẠP</h1>
  <p>Quản lý đơn nạp kim cương Free Fire</p>
</div>

<div class="container">

  <!-- ================= LOGIN ================= -->

  <div id="loginBox" class="login-box">

    <h2>🔐 Đăng nhập Admin</h2>

    <input
      id="username"
      type="text"
      placeholder="Tên tài khoản"
      autocomplete="username"
    >

    <input
      id="password"
      type="password"
      placeholder="Mật khẩu"
      autocomplete="current-password"
    >

    <button
      class="login-btn"
      onclick="login()"
    >
      Đăng nhập
    </button>

    <div
      id="loginMessage"
      class="message"
    ></div>

  </div>


  <!-- ================= ADMIN ================= -->

  <div
    id="adminBox"
    class="admin-box"
    style="display:none;"
  >

    <h2>📋 Danh sách đơn nạp</h2>

    <button
      class="reload-btn"
      onclick="loadOrders()"
    >
      🔄 Tải lại
    </button>

    <button
      class="logout-btn"
      onclick="logout()"
    >
      Đăng xuất
    </button>

    <div class="search-box">

      <input
        id="search"
        type="text"
        placeholder="🔎 Nhập ID Free Fire để tìm..."
        oninput="renderOrders()"
      >

    </div>

    <div id="orders">
      <div class="empty">
        Chưa có dữ liệu.
      </div>
    </div>

  </div>

</div>


<script>

/* =====================================================
   ADMIN
   ===================================================== */

let orders = [];

let authHeader = "";


/* =====================================================
   HIỂN THỊ THÔNG BÁO
   ===================================================== */

function showMessage(
  elementId,
  text,
  success = false
) {

  const element =
    document.getElementById(elementId);

  element.innerText = text;

  element.className =
    "message show";

  element.style.background =
    success ? "#123d25" : "#4a2020";

  element.style.color =
    success ? "#58f58c" : "#ff7777";
}


/* =====================================================
   ĐĂNG NHẬP
   ===================================================== */

function login() {

  const username =
    document
      .getElementById("username")
      .value
      .trim();

  const password =
    document
      .getElementById("password")
      .value;

  if (!username || !password) {

    showMessage(
      "loginMessage",
      "Vui lòng nhập tài khoản và mật khẩu."
    );

    return;
  }


  authHeader =
    "Basic " +
    btoa(
      username + ":" + password
    );


  fetch(
    "/api/admin/orders",
    {
      headers: {
        Authorization: authHeader
      }
    }
  )
  .then(async response => {

    const data =
      await response.json()
        .catch(() => ({}));


    if (!response.ok) {

      throw new Error(
        data.error ||
        data.message ||
        "Đăng nhập thất bại."
      );

    }

    return data;

  })
  .then(data => {

    if (!data.success) {

      throw new Error(
        "Đăng nhập thất bại."
      );

    }


    sessionStorage.setItem(
      "adminAuth",
      authHeader
    );


    document
      .getElementById("loginBox")
      .style.display = "none";


    document
      .getElementById("adminBox")
      .style.display = "block";


    orders =
      data.orders || [];


    renderOrders();

  })
  .catch(error => {

    authHeader = "";

    showMessage(
      "loginMessage",
      error.message
    );

  });

}


/* =====================================================
   TẢI ĐƠN
   ===================================================== */

function loadOrders() {

  const savedAuth =
    sessionStorage.getItem(
      "adminAuth"
    );


  if (!savedAuth) {

    logout();

    return;
  }


  authHeader =
    savedAuth;


  fetch(
    "/api/admin/orders",
    {
      headers: {
        Authorization: authHeader
      }
    }
  )
  .then(async response => {

    const data =
      await response.json()
        .catch(() => ({}));


    if (!response.ok) {

      throw new Error(
        data.error ||
        "Không thể tải đơn."
      );

    }

    return data;

  })
  .then(data => {

    orders =
      data.orders || [];

    renderOrders();

  })
  .catch(error => {

    alert(error.message);

    if (
      error.message
        .toLowerCase()
        .includes("unauthorized")
    ) {

      logout();

    }

  });

}


/* =====================================================
   HIỂN THỊ ĐƠN
   ===================================================== */

function renderOrders() {

  const container =
    document.getElementById(
      "orders"
    );


  const keyword =
    document
      .getElementById("search")
      .value
      .trim()
      .toLowerCase();


  let filtered =
    orders.filter(order => {

      if (!keyword) {
        return true;
      }

      return String(
        order.player_id || ""
      )
      .toLowerCase()
      .includes(keyword);

    });


  if (!filtered.length) {

    container.innerHTML =
      `<div class="empty">
        Không tìm thấy đơn nào.
      </div>`;

    return;
  }


  container.innerHTML =
    filtered.map(order => {

      const isPaid =
        order.status === "PAID";


      const isSuccess =
        order.status === "SUCCESS";


      let statusText =
        "Đang chờ thanh toán";

      let statusClass =
        "pending";


      if (isPaid) {

        statusText =
          "Đã thanh toán";

        statusClass =
          "paid";

      }


      if (isSuccess) {

        statusText =
          "Đã nạp thành công";

        statusClass =
          "success";

      }


      const amount =
        Number(order.amount || 0)
          .toLocaleString("vi-VN");


      const paidAmount =
        order.paid_amount
          ? Number(
              order.paid_amount
            ).toLocaleString("vi-VN")
          : "---";


      return `

        <div class="order">

          <div class="order-row">
            <span class="label">
              🎮 ID Free Fire
            </span>

            <span class="value">
              ${escapeHtml(
                order.player_id
              )}
            </span>
          </div>


          <div class="order-row">
            <span class="label">
              💎 Gói
            </span>

            <span class="value">
              ${escapeHtml(
                order.package_name
              )}
            </span>
          </div>


          <div class="order-row">
            <span class="label">
              💰 Số tiền
            </span>

            <span class="value">
              ${amount} VND
            </span>
          </div>


          <div class="order-row">
            <span class="label">
              📝 Nội dung
            </span>

            <span class="value">
              ${escapeHtml(
                order.payment_content ||
                order.order_code ||
                "---"
              )}
            </span>
          </div>


          <div class="order-row">
            <span class="label">
              💳 Tiền nhận
            </span>

            <span class="value">
              ${paidAmount} VND
            </span>
          </div>


          <div class="order-row">
            <span class="label">
              📦 Mã đơn
            </span>

            <span class="value">
              ${escapeHtml(
                order.order_code
              )}
            </span>
          </div>


          <div class="order-row">

            <span class="label">
              📊 Trạng thái
            </span>

            <span
              class="value ${statusClass}"
            >
              ${statusText}
            </span>

          </div>


          ${
            isPaid && !isSuccess
              ? `
                <button
                  class="confirm-btn"
                  onclick="confirmSuccess(
                    '${escapeJs(
                      order.order_code
                    )}'
                  )"
                >
                  💎 Xác nhận đã nạp thành công
                </button>
              `
              : ""
          }


          ${
            isSuccess
              ? `
                <button
                  class="confirm-btn"
                  disabled
                >
                  ✅ Đã nạp thành công
                </button>
              `
              : ""
          }

        </div>

      `;

    }).join("");

}


/* =====================================================
   XÁC NHẬN ĐÃ NẠP THÀNH CÔNG
   ===================================================== */

function confirmSuccess(
  orderCode
) {

  if (
    !confirm(
      "Bạn đã nạp kim cương vào nick này chưa?"
    )
  ) {

    return;
  }


  fetch(
    "/api/admin/orders/" +
    encodeURIComponent(
      orderCode
    ) +
    "/success",
    {
      method: "POST",

      headers: {
        Authorization: authHeader,
        "Content-Type":
          "application/json"
      }
    }
  )
  .then(async response => {

    const data =
      await response.json()
        .catch(() => ({}));


    if (!response.ok) {

      throw new Error(
        data.message ||
        data.error ||
        "Không thể xác nhận."
      );

    }

    return data;

  })
  .then(data => {

    if (!data.success) {

      throw new Error(
        data.message ||
        "Không thể xác nhận."
      );

    }


    alert(
      "✅ Đã xác nhận nạp thành công!"
    );


    loadOrders();

  })
  .catch(error => {

    alert(
      "❌ " +
      error.message
    );

  });

}


/* =====================================================
   ĐĂNG XUẤT
   ===================================================== */

function logout() {

  sessionStorage.removeItem(
    "adminAuth"
  );

  authHeader = "";

  orders = [];


  document
    .getElementById("adminBox")
    .style.display = "none";


  document
    .getElementById("loginBox")
    .style.display = "block";


  document
    .getElementById("username")
    .value = "";


  document
    .getElementById("password")
    .value = "";

}


/* =====================================================
   CHỐNG HTML INJECTION
   ===================================================== */

function escapeHtml(value) {

  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


function escapeJs(value) {

  return String(value ?? "")
    .replace(/\\/g, "\\\\")
    .replace(/'/g, "\\'");

}


/* =====================================================
   TỰ ĐĂNG NHẬP LẠI KHI MỞ TRANG
   ===================================================== */

window.addEventListener(
  "DOMContentLoaded",
  function() {

    const savedAuth =
      sessionStorage.getItem(
        "adminAuth"
      );


    if (!savedAuth) {
      return;
    }


    authHeader =
      savedAuth;


    document
      .getElementById("loginBox")
      .style.display = "none";


    document
      .getElementById("adminBox")
      .style.display = "block";


    loadOrders();

  }
);

</script>

</body>
</html>
