<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>FF Shop — Nạp Kim Cương Demo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="wrap">
    <section class="hero">
      <span class="tag">1S SHOP • DEMO</span>
      <h1>FREE FIRE</h1>
      <p>Nạp nhanh • Tạo đơn • Thanh toán an toàn</p>
    </section>

    <section class="card">
      <h2>Tạo đơn nạp</h2>
      <form id="form">
        <label>ID nhân vật</label>
        <input id="playerId" inputmode="numeric" placeholder="Ví dụ: 123456789" required>

        <label>Mệnh giá</label>
        <select id="amount" required>
          <option value="">Chọn mệnh giá</option>
          <option value="10000">10.000đ</option>
          <option value="20000">20.000đ</option>
          <option value="50000">50.000đ</option>
          <option value="100000">100.000đ</option>
          <option value="200000">200.000đ</option>
          <option value="500000">500.000đ</option>
        </select>

        <button>TẠO ĐƠN</button>
      </form>

      <div id="result"></div>
    </section>

    <section class="card">
      <h2>Tra cứu đơn</h2>
      <div class="row">
        <input id="lookup" placeholder="Mã đơn FF...">
        <button id="check">Tra cứu</button>
      </div>
      <div id="status"></div>
    </section>

    <p class="warning">
      DEMO: chưa kết nối Garena hoặc cổng thanh toán thật. Không nhập mật khẩu
      Garena, mã thẻ hoặc thông tin nhạy cảm vào trang này.
    </p>
  </main>
  <script src="app.js"></script>
</body>
</html>
